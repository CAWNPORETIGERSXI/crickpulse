<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CRICKPULSE - Mobile OTP Login"
    >

    <title>CRICKPULSE | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================
           AUTH PAGE
        ====================================== */

        .auth-page {

            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px 18px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 136, 0, 0.12),
                    transparent 55%
                ),
                #050505;
        }


        .auth-card {

            width: 100%;
            max-width: 440px;

            padding: 32px 22px;

            background: #101010;

            border: 1px solid rgba(255, 136, 0, 0.35);

            border-radius: 18px;

            box-shadow:
                0 0 35px rgba(255, 136, 0, 0.08);

            text-align: center;
        }


        .auth-logo {

            width: 62px;
            height: 62px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ff8800;

            color: #050505;

            border-radius: 14px;

            font-size: 21px;
            font-weight: 900;

            box-shadow:
                0 0 20px rgba(255, 136, 0, 0.35);
        }


        .auth-card h1 {

            font-size: 28px;
            font-weight: 900;

            margin: 0;
        }


        .auth-card h1 span {

            color: #ff8800;
        }


        .auth-subtitle {

            margin: 9px 0 28px;

            color: #a9a9a9;

            font-size: 14px;

            line-height: 1.5;
        }


        .auth-label {

            display: block;

            margin-bottom: 8px;

            text-align: left;

            color: #ffffff;

            font-size: 13px;
            font-weight: 700;
        }


        .phone-box {

            display: flex;

            gap: 8px;
        }


        .country-code {

            width: 72px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #050505;

            border: 1px solid #333;

            border-radius: 8px;

            color: #ff8800;

            font-size: 15px;

            font-weight: 800;
        }


        .auth-input {

            width: 100%;

            padding: 14px 13px;

            background: #050505;

            border: 1px solid #333;

            border-radius: 8px;

            color: #ffffff;

            font-size: 16px;

            outline: none;
        }


        .auth-input:focus {

            border-color: #ff8800;

            box-shadow:
                0 0 0 2px rgba(255, 136, 0, 0.08);
        }


        .auth-btn {

            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: 0;

            border-radius: 8px;

            background: #ff8800;

            color: #050505;

            font-size: 14px;

            font-weight: 900;

            cursor: pointer;
        }


        .auth-btn:disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        .otp-section {

            display: none;

            margin-top: 24px;
        }


        .otp-section.show {

            display: block;
        }


        .otp-info {

            margin-bottom: 14px;

            color: #a9a9a9;

            font-size: 13px;

            line-height: 1.5;
        }


        .otp-input {

            text-align: center;

            letter-spacing: 8px;

            font-size: 22px;

            font-weight: 800;
        }


        .resend-btn {

            margin-top: 15px;

            background: transparent;

            border: 0;

            color: #ff8800;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;
        }


        .message {

            min-height: 20px;

            margin-top: 18px;

            font-size: 13px;

            line-height: 1.5;
        }


        .message.error {

            color: #ff4a4a;
        }


        .message.success {

            color: #55d66a;
        }


        .security-note {

            margin-top: 25px;

            color: #666;

            font-size: 11px;

            line-height: 1.5;
        }


        .back-home {

            display: inline-block;

            margin-top: 20px;

            color: #a9a9a9;

            text-decoration: none;

            font-size: 12px;
        }


        .back-home:hover {

            color: #ff8800;
        }


        #recaptcha-container {

            margin-top: 15px;
        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <div class="logo-area">

            <div class="logo-mark">
                CP
            </div>

            <div class="logo-text">

                <h1>CRICKPULSE</h1>

                <p>
                    Your Cricket. Your Pulse.
                </p>

            </div>

        </div>

    </header>



    <!-- =====================================
         AUTH PAGE
    ====================================== -->

    <main class="auth-page">

        <div class="auth-card">


            <div class="auth-logo">
                CP
            </div>


            <h1>
                CRICK<span>PULSE</span>
            </h1>


            <p class="auth-subtitle">

                Login with your mobile number.
                No password required.

            </p>



            <!-- =================================
                 PHONE SECTION
            ================================== -->

            <div id="phone-section">


                <label
                    class="auth-label"
                    for="phoneNumber"
                >
                    Mobile Number
                </label>


                <div class="phone-box">


                    <div class="country-code">
                        +91
                    </div>


                    <input
                        id="phoneNumber"
                        class="auth-input"
                        type="tel"
                        inputmode="numeric"
                        maxlength="10"
                        placeholder="Enter mobile number"
                        autocomplete="tel"
                    >

                </div>



                <!-- Firebase reCAPTCHA -->

                <div id="recaptcha-container"></div>



                <button
                    id="sendOtpBtn"
                    class="auth-btn"
                >
                    SEND OTP
                </button>


            </div>



            <!-- =================================
                 OTP SECTION
            ================================== -->

            <div
                id="otp-section"
                class="otp-section"
            >


                <p class="otp-info">

                    Enter the 6-digit OTP sent to
                    your mobile number.

                </p>


                <input
                    id="otpCode"
                    class="auth-input otp-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="••••••"
                    autocomplete="one-time-code"
                >


                <button
                    id="verifyOtpBtn"
                    class="auth-btn"
                >
                    VERIFY & LOGIN
                </button>


                <button
                    id="resendBtn"
                    class="resend-btn"
                >
                    Use another number
                </button>


            </div>



            <!-- =================================
                 MESSAGE
            ================================== -->

            <div
                id="message"
                class="message"
            ></div>



            <p class="security-note">

                Your mobile number is used only
                to securely verify your CRICKPULSE account.

            </p>



            <a
                href="index.html"
                class="back-home"
            >
                ← Back to CRICKPULSE
            </a>


        </div>

    </main>



    <!-- =====================================
         FIREBASE AUTHENTICATION
    ====================================== -->

    <script type="module">

        /* =====================================
           FIREBASE
        ====================================== */

        import {
            auth
        } from "./firebase.js";


        import {
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";



        /* =====================================
           ELEMENTS
        ====================================== */

        const phoneNumber =
            document.getElementById("phoneNumber");


        const sendOtpBtn =
            document.getElementById("sendOtpBtn");


        const otpCode =
            document.getElementById("otpCode");


        const verifyOtpBtn =
            document.getElementById("verifyOtpBtn");


        const resendBtn =
            document.getElementById("resendBtn");


        const phoneSection =
            document.getElementById("phone-section");


        const otpSection =
            document.getElementById("otp-section");


        const message =
            document.getElementById("message");



        /* =====================================
           VARIABLES
        ====================================== */

        let recaptchaVerifier = null;

        let confirmationResult = null;



        /* =====================================
           MESSAGE
        ====================================== */

        function showMessage(text, type = "") {

            message.textContent = text;

            message.className =
                "message " + type;

        }



        /* =====================================
           SETUP RECAPTCHA
        ====================================== */

        function setupRecaptcha() {

            try {

                if (recaptchaVerifier) {

                    recaptchaVerifier.clear();

                }


                recaptchaVerifier =
                    new RecaptchaVerifier(
                        auth,
                        "recaptcha-container",
                        {
                            size: "normal",

                            callback: function () {

                                showMessage(
                                    "reCAPTCHA verified. You can send the OTP.",
                                    "success"
                                );

                            },

                            "expired-callback":
                                function () {

                                    showMessage(
                                        "reCAPTCHA expired. Please verify again.",
                                        "error"
                                    );

                                }

                        }
                    );


            } catch (error) {

                console.error(
                    "reCAPTCHA error:",
                    error
                );

                showMessage(
                    "Unable to load security verification.",
                    "error"
                );

            }

        }



        /* =====================================
           INITIALIZE RECAPTCHA
        ====================================== */

        setupRecaptcha();



        /* =====================================
           SEND OTP
        ====================================== */

        sendOtpBtn.addEventListener(
            "click",
            async function () {


                const number =
                    phoneNumber.value.trim();



                /* -----------------------------
                   VALIDATE NUMBER
                ----------------------------- */

                if (!/^[6-9]\d{9}$/.test(number)) {

                    showMessage(
                        "Please enter a valid 10-digit Indian mobile number.",
                        "error"
                    );

                    return;

                }



                /* -----------------------------
                   FULL PHONE NUMBER
                ----------------------------- */

                const fullPhoneNumber =
                    "+91" + number;



                /* -----------------------------
                   BUTTON STATE
                ----------------------------- */

                sendOtpBtn.disabled = true;

                sendOtpBtn.textContent =
                    "SENDING OTP...";


                showMessage(
                    "Please wait...",
                    ""
                );



                try {


                    /* -------------------------
                       SEND OTP
                    ------------------------- */

                    confirmationResult =
                        await signInWithPhoneNumber(
                            auth,
                            fullPhoneNumber,
                            recaptchaVerifier
                        );



                    /* -------------------------
                       SHOW OTP SECTION
                    ------------------------- */

                    phoneSection.style.display =
                        "none";


                    otpSection.classList.add(
                        "show"
                    );


                    showMessage(
                        "OTP sent successfully.",
                        "success"
                    );


                    otpCode.focus();



                } catch (error) {


                    console.error(
                        "SEND OTP ERROR:",
                        error
                    );


                    sendOtpBtn.disabled = false;

                    sendOtpBtn.textContent =
                        "SEND OTP";



                    let errorMessage =
                        "Unable to send OTP. Please try again.";



                    if (
                        error.code ===
                        "auth/invalid-phone-number"
                    ) {

                        errorMessage =
                            "Invalid mobile number.";

                    }


                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        errorMessage =
                            "Too many attempts. Please try again later.";

                    }


                    else if (
                        error.code ===
                        "auth/quota-exceeded"
                    ) {

                        errorMessage =
                            "SMS limit has been exceeded. Please try again later.";

                    }


                    else if (
                        error.code ===
                        "auth/operation-not-allowed"
                    ) {

                        errorMessage =
                            "Phone login is not enabled in Firebase.";

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );



                    /* -------------------------
                       RESET RECAPTCHA
                    ------------------------- */

                    try {

                        recaptchaVerifier.clear();

                    } catch (e) {

                        console.log(e);

                    }


                    setupRecaptcha();

                }

            }
        );



        /* =====================================
           VERIFY OTP
        ====================================== */

        verifyOtpBtn.addEventListener(
            "click",
            async function () {


                const code =
                    otpCode.value.trim();



                /* -----------------------------
                   VALIDATE OTP
                ----------------------------- */

                if (!/^\d{6}$/.test(code)) {

                    showMessage(
                        "Please enter the 6-digit OTP.",
                        "error"
                    );

                    return;

                }



                if (!confirmationResult) {

                    showMessage(
                        "Please request a new OTP.",
                        "error"
                    );

                    return;

                }



                /* -----------------------------
                   BUTTON STATE
                ----------------------------- */

                verifyOtpBtn.disabled = true;

                verifyOtpBtn.textContent =
                    "VERIFYING...";



                try {


                    /* -------------------------
                       VERIFY OTP
                    ------------------------- */

                    const result =
                        await confirmationResult.confirm(
                            code
                        );



                    console.log(
                        "LOGIN SUCCESS:",
                        result.user
                    );



                    showMessage(
                        "Login successful! Redirecting...",
                        "success"
                    );



                    /* -------------------------
                       REDIRECT
                    ------------------------- */

                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        1000
                    );



                } catch (error) {


                    console.error(
                        "OTP VERIFICATION ERROR:",
                        error
                    );


                    verifyOtpBtn.disabled = false;

                    verifyOtpBtn.textContent =
                        "VERIFY & LOGIN";



                    let errorMessage =
                        "Invalid OTP. Please try again.";



                    if (
                        error.code ===
                        "auth/invalid-verification-code"
                    ) {

                        errorMessage =
                            "Incorrect OTP. Please check and try again.";

                    }


                    else if (
                        error.code ===
                        "auth/code-expired"
                    ) {

                        errorMessage =
                            "This OTP has expired. Please request a new OTP.";

                    }



                    showMessage(
                        errorMessage,
                        "error"
                    );

                }

            }
        );



        /* =====================================
           USE ANOTHER NUMBER
        ====================================== */

        resendBtn.addEventListener(
            "click",
            function () {


                confirmationResult = null;


                otpCode.value = "";



                otpSection.classList.remove(
                    "show"
                );


                phoneSection.style.display =
                    "block";


                sendOtpBtn.disabled = false;


                sendOtpBtn.textContent =
                    "SEND OTP";


                showMessage(
                    "",
                    ""
                );



                /* -----------------------------
                   RESET RECAPTCHA
                ----------------------------- */

                try {

                    if (recaptchaVerifier) {

                        recaptchaVerifier.clear();

                    }

                } catch (error) {

                    console.log(error);

                }


                setupRecaptcha();


                phoneNumber.focus();

            }
        );



        /* =====================================
           OTP INPUT ONLY NUMBERS
        ====================================== */

        otpCode.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

            }
        );



        /* =====================================
           PHONE INPUT ONLY NUMBERS
        ====================================== */

        phoneNumber.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

            }
        );



        /* =====================================
           ENTER KEY - PHONE
        ====================================== */

        phoneNumber.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    sendOtpBtn.click();

                }

            }
        );



        /* =====================================
           ENTER KEY - OTP
        ====================================== */

        otpCode.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    verifyOtpBtn.click();

                }

            }
        );



        /* =====================================
           AUTH PAGE LOADED
        ====================================== */

        console.log(
            "CRICKPULSE authentication page loaded."
        );

    </script>

</body>

</html>
