<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CRICKPULSE - Dashboard"
    >

    <title>CRICKPULSE | Home</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {

            font-family:
                Verdana,
                Geneva,
                sans-serif;

            background: #f7f5ff;

            color: #171225;

            min-height: 100vh;

            font-weight: 400;
        }


        /* =========================================
           HEADER
        ========================================= */

        .top-header {

            height: 74px;

            background: #ffffff;

            border-bottom: 1px solid #e7e1f5;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            padding: 0 14px;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        /* =========================================
           HEADER LEFT
        ========================================= */

        .header-left {

            display: flex;

            align-items: center;

            gap: 14px;
        }


        /* =========================================
           HAMBURGER
        ========================================= */

        .menu-button {

            width: 56px;

            height: 56px;

            border: 0;

            background: #f1edff;

            border-radius: 14px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 6px;

            cursor: pointer;

            flex-shrink: 0;

            -webkit-tap-highlight-color: transparent;
        }


        .menu-button span {

            display: block;

            width: 32px;

            height: 4px;

            background: #5b2fc2;

            border-radius: 10px;
        }


        .menu-button:active {

            transform: scale(.96);
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .brand-logo {

            width: 44px;

            height: 44px;

            border-radius: 12px;

            background: #6c35d9;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;

            font-weight: 400;
        }


        .brand-name {

            font-size: 24px;

            font-weight: 400;

            letter-spacing: .2px;

            color: #171225;
        }


        .brand-name span {

            color: #6c35d9;
        }


        /* =========================================
           MAIN DASHBOARD
        ========================================= */

        .dashboard {

            padding: 30px 16px 45px;

            max-width: 700px;

            margin: auto;
        }


        /* =========================================
           WELCOME CARD
        ========================================= */

        .welcome-card {

            background: #ffffff;

            border-radius: 20px;

            padding: 28px 21px;

            border: 1px solid #e8e1f7;

            box-shadow:
                0 8px 25px rgba(
                    76,
                    45,
                    130,
                    .07
                );
        }


        .welcome-small {

            color: #7659a9;

            font-size: 18px;

            font-weight: 400;

            margin-bottom: 10px;
        }


        .welcome-title {

            font-size: 36px;

            line-height: 1.2;

            font-weight: 400;

            letter-spacing: -.5px;
        }


        .welcome-title span {

            color: #6c35d9;
        }


        .welcome-text {

            margin-top: 12px;

            color: #6d667c;

            font-size: 19px;

            line-height: 1.6;

            font-weight: 400;
        }


        /* =========================================
           MENU OVERLAY
        ========================================= */

        .menu-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(
                    15,
                    10,
                    25,
                    .45
                );

            z-index: 200;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;
        }


        .menu-overlay.active {

            opacity: 1;

            visibility: visible;
        }


        /* =========================================
           SIDE MENU
        ========================================= */

        .side-menu {

            position: absolute;

            top: 0;

            left: 0;

            width: min(
                88%,
                390px
            );

            height: 100%;

            background: #ffffff;

            box-shadow:
                8px 0 35px
                rgba(
                    0,
                    0,
                    0,
                    .18
                );

            transform:
                translateX(-100%);

            transition:
                transform .28s ease;

            display: flex;

            flex-direction: column;
        }


        .menu-overlay.active
        .side-menu {

            transform:
                translateX(0);
        }


        /* =========================================
           MENU HEADER
        ========================================= */

        .menu-top {

            min-height: 74px;

            padding: 0 16px;

            border-bottom:
                1px solid #eee9f7;

            display: flex;

            align-items: center;

            justify-content:
                space-between;
        }


        .menu-title {

            font-size: 25px;

            font-weight: 400;

            color: #211733;
        }


        .close-button {

            width: 46px;

            height: 46px;

            border: 0;

            border-radius: 12px;

            background: #f2eff9;

            color: #33244d;

            font-size: 30px;

            line-height: 1;

            cursor: pointer;

            font-weight: 400;
        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile-section {

            padding: 21px 18px;

            background:
                linear-gradient(
                    135deg,
                    #f5f0ff,
                    #ffffff
                );

            border-bottom:
                1px solid #e8e1f5;
        }


        .profile-row {

            display: flex;

            align-items: center;

            gap: 14px;
        }


        .profile-photo {

            width: 68px;

            height: 68px;

            flex: 0 0 68px;

            border-radius: 50%;

            background: #e8ddff;

            border: 3px solid #ffffff;

            box-shadow:
                0 3px 12px
                rgba(
                    92,
                    47,
                    180,
                    .18
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #6c35d9;

            font-size: 25px;

            font-weight: 400;

            overflow: hidden;
        }


        .profile-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: none;
        }


        .profile-info {

            min-width: 0;

            flex: 1;
        }


        .profile-name {

            font-size: 23px;

            font-weight: 400;

            color: #1b1428;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .profile-mobile {

            margin-top: 5px;

            font-size: 18px;

            font-weight: 400;

            color: #665d72;
        }


        .profile-email {

            margin-top: 4px;

            font-size: 17px;

            font-weight: 400;

            color: #786f85;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================
           MENU SECTION
        ========================================= */

        .menu-section {

            padding: 13px 12px 20px;

            overflow-y: auto;

            flex: 1;
        }


        .menu-label {

            padding:
                8px 10px 11px;

            color: #8b819a;

            font-size: 14px;

            font-weight: 400;

            text-transform:
                uppercase;

            letter-spacing: 1px;
        }


        /* =========================================
           MENU ITEM
        ========================================= */

        .menu-item {

            width: 100%;

            min-height: 66px;

            border: 0;

            background: transparent;

            border-radius: 13px;

            padding: 10px 12px;

            display: flex;

            align-items: center;

            gap: 13px;

            text-align: left;

            cursor: pointer;

            color: #251b35;

            font-size: 19px;

            font-weight: 400;
        }


        .menu-item:hover {

            background: #f4f0ff;
        }


        .menu-icon {

            width: 42px;

            height: 42px;

            flex: 0 0 42px;

            border-radius: 11px;

            background: #f0eaff;

            color: #6430c5;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

            font-weight: 400;
        }


        .menu-item-text {

            flex: 1;

            line-height: 1.35;
        }


        .menu-arrow {

            color: #aaa1b4;

            font-size: 29px;

            font-weight: 300;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {


            .top-header {

                height: 72px;

                padding: 0 11px;
            }


            .header-left {

                gap: 12px;
            }


            .menu-button {

                width: 56px;

                height: 56px;
            }


            .menu-button span {

                width: 32px;

                height: 4px;
            }


            .brand-name {

                font-size: 22px;

                font-weight: 400;
            }


            .brand-logo {

                width: 42px;

                height: 42px;

                font-size: 16px;
            }


            .dashboard {

                padding:
                    22px 14px 40px;
            }


            .welcome-card {

                padding:
                    27px 19px;
            }


            .welcome-small {

                font-size: 17px;
            }


            .welcome-title {

                font-size: 34px;

                font-weight: 400;
            }


            .welcome-text {

                font-size: 18px;
            }


            .side-menu {

                width: 91%;
            }


            .menu-title {

                font-size: 23px;
            }


            .profile-name {

                font-size: 21px;
            }


            .profile-mobile {

                font-size: 17px;
            }


            .profile-email {

                font-size: 16px;
            }


            .menu-item {

                font-size: 18px;

                min-height: 64px;

                font-weight: 400;
            }


            .menu-icon {

                width: 41px;

                height: 41px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="top-header">


    <div class="header-left">


        <!-- HAMBURGER - LEFT -->

        <button
            class="menu-button"
            id="openMenu"
            aria-label="Open menu"
        >

            <span></span>

            <span></span>

            <span></span>

        </button>


        <!-- BRAND -->

        <div class="brand">


            <div class="brand-logo">
                CP
            </div>


            <div class="brand-name">
                CRICK<span>PULSE</span>
            </div>


        </div>


    </div>


</header>



<!-- =========================================
     DASHBOARD
========================================= -->

<main class="dashboard">


    <section class="welcome-card">


        <div class="welcome-small">
            Welcome to
        </div>


        <h1 class="welcome-title">
            CRICK<span>PULSE</span>
        </h1>


        <p class="welcome-text">
            Your cricket journey starts here.
        </p>


    </section>


</main>



<!-- =========================================
     SIDE MENU
========================================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
>


    <aside class="side-menu">


        <!-- MENU HEADER -->

        <div class="menu-top">


            <div class="menu-title">
                CRICKPULSE
            </div>


            <button
                class="close-button"
                id="closeMenu"
                aria-label="Close menu"
            >
                ×
            </button>


        </div>



        <!-- PLAYER PROFILE -->

        <section class="profile-section">


            <div class="profile-row">


                <div class="profile-photo">


                    <img
                        id="profilePhoto"
                        src=""
                        alt="Player"
                    >


                    <span
                        id="profileInitial"
                    >
                        P
                    </span>


                </div>


                <div class="profile-info">


                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        Player Name
                    </div>


                    <div
                        class="profile-mobile"
                        id="profileMobile"
                    >
                        Mobile Number
                    </div>


                    <div
                        class="profile-email"
                        id="profileEmail"
                    >
                        Gmail / Email
                    </div>


                </div>


            </div>


        </section>



        <!-- MENU -->

        <section class="menu-section">


            <div class="menu-label">
                Menu
            </div>



            <!-- 1 -->

            <button
                class="menu-item"
                type="button"
                id="addTournamentBtn"
            >

                <div class="menu-icon">
                    🏆
                </div>


                <div class="menu-item-text">
                    Add a Tournament / Series
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 2 -->

            <button
                class="menu-item"
                type="button"
                id="newMatchBtn"
            >

                <div class="menu-icon">
                    🏏
                </div>


                <div class="menu-item-text">
                    Start a New Match
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 3 -->

            <button
                class="menu-item"
                type="button"
                id="myCricketBtn"
            >

                <div class="menu-icon">
                    👤
                </div>


                <div class="menu-item-text">
                    My Cricket
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 4 -->

            <button
                class="menu-item"
                type="button"
                id="contactBtn"
            >

                <div class="menu-icon">
                    💬
                </div>


                <div class="menu-item-text">
                    Contact
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 5 -->

            <button
                class="menu-item"
                type="button"
                id="shareBtn"
            >

                <div class="menu-icon">
                    ↗
                </div>


                <div class="menu-item-text">
                    Share the Site / App
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>


        </section>


    </aside>


</div>



<script>


    /* =========================================
       LOGIN CHECK
    ========================================= */

    const loggedIn =
        sessionStorage.getItem(
            "crickpulseLoggedIn"
        );


    if (loggedIn !== "true") {

        window.location.href =
            "auth.html";

    }



    /* =========================================
       PROFILE MOBILE
    ========================================= */

    const mobile =
        sessionStorage.getItem(
            "crickpulseMobile"
        );


    if (mobile) {

        document
            .getElementById(
                "profileMobile"
            )
            .textContent = mobile;

    }



    /* =========================================
       HAMBURGER
    ========================================= */

    const openMenu =
        document.getElementById(
            "openMenu"
        );


    const closeMenu =
        document.getElementById(
            "closeMenu"
        );


    const menuOverlay =
        document.getElementById(
            "menuOverlay"
        );



    /* OPEN MENU */

    openMenu.addEventListener(
        "click",
        function () {

            menuOverlay.classList.add(
                "active"
            );

        }
    );



    /* CLOSE MENU */

    closeMenu.addEventListener(
        "click",
        function () {

            menuOverlay.classList.remove(
                "active"
            );

        }
    );



    /* CLOSE OUTSIDE */

    menuOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                menuOverlay
            ) {

                menuOverlay.classList.remove(
                    "active"
                );

            }

        }
    );



    /* =========================================
       MENU BUTTONS
    ========================================= */

    document
        .getElementById(
            "addTournamentBtn"
        )
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Add Tournament / Series"
                );

            }
        );


    document
        .getElementById(
            "newMatchBtn"
        )
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Start New Match"
                );

            }
        );


    document
        .getElementById(
            "myCricketBtn"
        )
        .addEventListener(
            "click",
            function () {

                console.log(
                    "My Cricket"
                );

            }
        );


    document
        .getElementById(
            "contactBtn"
        )
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Contact"
                );

            }
        );



    /* =========================================
       SHARE
    ========================================= */

    document
        .getElementById(
            "shareBtn"
        )
        .addEventListener(
            "click",
            async function () {


                const shareData = {

                    title:
                        "CRICKPULSE",

                    text:
                        "Join me on CRICKPULSE.",

                    url:
                        window.location.origin

                };


                if (
                    navigator.share
                ) {

                    try {

                        await navigator.share(
                            shareData
                        );

                    }

                    catch (error) {

                        console.log(
                            "Share cancelled."
                        );

                    }

                }

                else {

                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                window.location.origin
                            );

                        alert(
                            "CRICKPULSE link copied."
                        );

                    }

                    catch (error) {

                        alert(
                            "Please copy the site link manually."
                        );

                    }

                }


            }
        );


    console.log(
        "CRICKPULSE dashboard loaded."
    );


</script>


</body>

</html>
