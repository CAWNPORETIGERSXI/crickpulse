<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CRICKPULSE - Dashboard"
    >

    <title>CRICKPULSE | Home</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Verdana, Geneva, sans-serif;

            background: #f7f5ff;

            color: #171225;

            min-height: 100vh;
        }


        /* =========================================
           HEADER
        ========================================= */

        .top-header {

            height: 72px;

            background: #ffffff;

            border-bottom: 1px solid #e7e1f5;

            display: flex;

            align-items: center;

            padding: 0 16px;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        /* =========================================
           HAMBURGER - LEFT
        ========================================= */

        .menu-button {

            width: 54px;

            height: 54px;

            border: 0;

            background: #f1edff;

            border-radius: 14px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 6px;

            cursor: pointer;

            flex-shrink: 0;

            margin-right: 14px;
        }


        .menu-button span {

            width: 29px;

            height: 4px;

            background: #6330c7;

            border-radius: 10px;
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .brand-logo {

            width: 44px;

            height: 44px;

            border-radius: 12px;

            background: #6c35d9;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;

            font-weight: 900;
        }


        .brand-name {

            font-size: 21px;

            font-weight: 900;

            letter-spacing: .3px;
        }


        .brand-name span {

            color: #6c35d9;
        }


        /* =========================================
           MAIN DASHBOARD
        ========================================= */

        .dashboard {

            padding: 30px 16px 45px;

            max-width: 700px;

            margin: auto;
        }


        .welcome-card {

            background: #ffffff;

            border-radius: 20px;

            padding: 28px 21px;

            border: 1px solid #e8e1f7;

            box-shadow:
                0 8px 25px rgba(76, 45, 130, .07);
        }


        .welcome-small {

            color: #7659a9;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .welcome-title {

            font-size: 30px;

            line-height: 1.2;

            font-weight: 900;
        }


        .welcome-title span {

            color: #6c35d9;
        }


        .welcome-text {

            margin-top: 11px;

            color: #6d667c;

            font-size: 17px;

            line-height: 1.6;
        }


        /* =========================================
           OVERLAY
        ========================================= */

        .menu-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(15, 10, 25, .55);

            z-index: 200;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;
        }


        .menu-overlay.active {

            opacity: 1;

            visibility: visible;
        }


        /* =========================================
           SIDE MENU
           WIDER + PURPLE
        ========================================= */

        .side-menu {

            position: absolute;

            top: 0;

            left: 0;

            width: min(94%, 430px);

            height: 100%;

            background: #6c35d9;

            box-shadow:
                8px 0 35px rgba(0, 0, 0, .28);

            transform:
                translateX(-100%);

            transition:
                transform .28s ease;

            display: flex;

            flex-direction: column;
        }


        .menu-overlay.active .side-menu {

            transform:
                translateX(0);
        }


        /* =========================================
           MENU TOP
        ========================================= */

        .menu-top {

            min-height: 74px;

            padding: 0 18px;

            border-bottom:
                1px solid rgba(255,255,255,.20);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .menu-title {

            font-size: 22px;

            font-weight: 900;

            color: #ffffff;

            letter-spacing: .3px;
        }


        .close-button {

            width: 46px;

            height: 46px;

            border: 0;

            border-radius: 13px;

            background:
                rgba(255,255,255,.16);

            color: #ffffff;

            font-size: 30px;

            line-height: 1;

            cursor: pointer;

            font-family: Verdana, Geneva, sans-serif;
        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile-section {

            padding: 22px 19px;

            background:
                rgba(0,0,0,.10);

            border-bottom:
                1px solid rgba(255,255,255,.18);
        }


        .profile-row {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .profile-photo {

            width: 70px;

            height: 70px;

            flex: 0 0 70px;

            border-radius: 50%;

            background: #ffffff;

            border: 3px solid rgba(255,255,255,.9);

            box-shadow:
                0 4px 14px rgba(0,0,0,.18);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #6c35d9;

            font-size: 25px;

            font-weight: 900;

            overflow: hidden;
        }


        .profile-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: none;
        }


        .profile-info {

            min-width: 0;

            flex: 1;
        }


        .profile-name {

            font-size: 20px;

            font-weight: 900;

            color: #ffffff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .profile-mobile {

            margin-top: 5px;

            font-size: 15px;

            font-weight: 700;

            color: #f3edff;
        }


        .profile-email {

            margin-top: 4px;

            font-size: 14px;

            font-weight: 600;

            color: #e3d8ff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================
           MENU SECTION
        ========================================= */

        .menu-section {

            padding: 14px 13px 22px;

            overflow-y: auto;

            flex: 1;
        }


        .menu-label {

            padding: 9px 11px 12px;

            color: #ddd0ff;

            font-size: 13px;

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =========================================
           MENU ITEM
        ========================================= */

        .menu-item {

            width: 100%;

            min-height: 64px;

            border: 0;

            background: transparent;

            border-radius: 14px;

            padding: 10px 13px;

            display: flex;

            align-items: center;

            gap: 14px;

            text-align: left;

            cursor: pointer;

            color: #ffffff;

            font-family: Verdana, Geneva, sans-serif;

            font-size: 17px;

            font-weight: 900;

            margin-bottom: 4px;
        }


        .menu-item:hover {

            background:
                rgba(255,255,255,.14);
        }


        .menu-item:active {

            background:
                rgba(255,255,255,.20);
        }


        /* =========================================
           MENU ICON
        ========================================= */

        .menu-icon {

            width: 43px;

            height: 43px;

            flex: 0 0 43px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.16);

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;

            font-weight: 900;
        }


        .menu-item-text {

            flex: 1;

            line-height: 1.3;

            color: #ffffff;
        }


        .menu-arrow {

            color: #e4d9ff;

            font-size: 27px;

            font-weight: 700;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {


            .top-header {

                height: 72px;

                padding: 0 12px;
            }


            .menu-button {

                width: 56px;

                height: 56px;

                margin-right: 12px;
            }


            .menu-button span {

                width: 31px;

                height: 4px;
            }


            .brand-name {

                font-size: 19px;
            }


            .brand-logo {

                width: 42px;

                height: 42px;
            }


            .dashboard {

                padding-top: 22px;
            }


            .welcome-title {

                font-size: 28px;
            }


            .welcome-text {

                font-size: 16px;
            }


            .side-menu {

                width: 94%;
            }


            .menu-item {

                min-height: 66px;

                font-size: 17px;
            }


            .profile-name {

                font-size: 19px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="top-header">


    <!-- HAMBURGER LEFT -->

    <button
        class="menu-button"
        id="openMenu"
        aria-label="Open menu"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-logo">
            CP
        </div>

        <div class="brand-name">
            CRICK<span>PULSE</span>
        </div>

    </div>


</header>



<!-- =========================================
     DASHBOARD
========================================= -->

<main class="dashboard">

    <section class="welcome-card">

        <div class="welcome-small">
            Welcome to
        </div>

        <h1 class="welcome-title">
            CRICK<span>PULSE</span>
        </h1>

        <p class="welcome-text">
            Your cricket journey starts here.
        </p>

    </section>

</main>



<!-- =========================================
     SIDE MENU
========================================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
>


    <aside class="side-menu">


        <!-- MENU HEADER -->

        <div class="menu-top">

            <div class="menu-title">
                CRICKPULSE
            </div>


            <button
                class="close-button"
                id="closeMenu"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>



        <!-- =====================================
             PLAYER PROFILE
        ====================================== -->

        <section class="profile-section">

            <div class="profile-row">


                <div class="profile-photo">

                    <img
                        id="profilePhoto"
                        src=""
                        alt="Player"
                    >

                    <span id="profileInitial">
                        P
                    </span>

                </div>


                <div class="profile-info">

                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        Player Name
                    </div>


                    <div
                        class="profile-mobile"
                        id="profileMobile"
                    >
                        Mobile Number
                    </div>


                    <div
                        class="profile-email"
                        id="profileEmail"
                    >
                        Gmail / Email
                    </div>

                </div>

            </div>

        </section>



        <!-- =====================================
             MENU
        ====================================== -->

        <section class="menu-section">


            <div class="menu-label">
                MENU
            </div>


            <!-- 1 -->

            <button
                class="menu-item"
                type="button"
                id="addTournamentBtn"
            >

                <div class="menu-icon">
                    🏆
                </div>

                <div class="menu-item-text">
                    Add a Tournament / Series
                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 2 -->

            <button
                class="menu-item"
                type="button"
                id="newMatchBtn"
            >

                <div class="menu-icon">
                    🏏
                </div>

                <div class="menu-item-text">
                    Start a New Match
                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 3 -->

            <button
                class="menu-item"
                type="button"
                id="myCricketBtn"
            >

                <div class="menu-icon">
                    👤
                </div>

                <div class="menu-item-text">
                    My Cricket
                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 4 -->

            <button
                class="menu-item"
                type="button"
                id="contactBtn"
            >

                <div class="menu-icon">
                    💬
                </div>

                <div class="menu-item-text">
                    Contact
                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 5 -->

            <button
                class="menu-item"
                type="button"
                id="shareBtn"
            >

                <div class="menu-icon">
                    ↗
                </div>

                <div class="menu-item-text">
                    Share the Site / App
                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>


        </section>


    </aside>

</div>



<script>


    /* =========================================
       LOGIN CHECK
    ========================================= */

    const loggedIn =
        sessionStorage.getItem(
            "crickpulseLoggedIn"
        );


    if (loggedIn !== "true") {

        window.location.href =
            "auth.html";

    }



    /* =========================================
       PROFILE DATA
    ========================================= */

    const mobile =
        sessionStorage.getItem(
            "crickpulseMobile"
        );


    if (mobile) {

        document
            .getElementById("profileMobile")
            .textContent = mobile;

    }



    /* =========================================
       HAMBURGER
    ========================================= */

    const openMenu =
        document.getElementById(
            "openMenu"
        );


    const closeMenu =
        document.getElementById(
            "closeMenu"
        );


    const menuOverlay =
        document.getElementById(
            "menuOverlay"
        );


    openMenu.addEventListener(
        "click",
        function () {

            menuOverlay.classList.add(
                "active"
            );

        }
    );


    closeMenu.addEventListener(
        "click",
        function () {

            menuOverlay.classList.remove(
                "active"
            );

        }
    );


    /* Close outside menu */

    menuOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target === menuOverlay
            ) {

                menuOverlay.classList.remove(
                    "active"
                );

            }

        }
    );



    /* =========================================
       MENU BUTTONS
    ========================================= */

    document
        .getElementById("addTournamentBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Add Tournament / Series"
                );

            }
        );


    document
        .getElementById("newMatchBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Start New Match"
                );

            }
        );


    document
        .getElementById("myCricketBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "My Cricket"
                );

            }
        );


    document
        .getElementById("contactBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Contact"
                );

            }
        );



    /* =========================================
       SHARE
    ========================================= */

    document
        .getElementById("shareBtn")
        .addEventListener(
            "click",
            async function () {


                const shareData = {

                    title:
                        "CRICKPULSE",

                    text:
                        "Join me on CRICKPULSE.",

                    url:
                        window.location.origin

                };


                if (
                    navigator.share
                ) {

                    try {

                        await navigator.share(
                            shareData
                        );

                    } catch (error) {

                        console.log(
                            "Share cancelled."
                        );

                    }

                } else {

                    try {

                        await navigator.clipboard.writeText(
                            window.location.origin
                        );

                        alert(
                            "CRICKPULSE link copied."
                        );

                    } catch (error) {

                        alert(
                            "Please copy the site link manually."
                        );

                    }

                }

            }
        );


    console.log(
        "CRICKPULSE dashboard loaded."
    );

</script>


</body>

</html>
