<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CRICKPULSE - Dashboard"
    >

    <title>CRICKPULSE | Home</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Verdana,
                Geneva,
                sans-serif;

            background: #f7f5ff;

            color: #171225;

            min-height: 100vh;
        }



        /* =========================================
           HEADER
        ========================================= */

        .top-header {

            height: 76px;

            background: #ffffff;

            border-bottom:
                1px solid #e5def4;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            padding: 0 16px;

            position: sticky;

            top: 0;

            z-index: 100;
        }



        /* =========================================
           HAMBURGER
        ========================================= */

        .menu-button {

            width: 58px;

            height: 58px;

            border: 0;

            background: #f0eaff;

            border-radius: 15px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 6px;

            cursor: pointer;

            flex-shrink: 0;

            margin-right: 14px;
        }


        .menu-button span {

            width: 31px;

            height: 4px;

            background: #6430c5;

            border-radius: 10px;
        }



        /* =========================================
           BRAND
        ========================================= */

        .brand {

            display: flex;

            align-items: center;

            gap: 11px;
        }


        .brand-logo {

            width: 46px;

            height: 46px;

            border-radius: 13px;

            background: #6c35d9;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            font-weight: 900;
        }


        .brand-name {

            font-family:
                Verdana,
                Geneva,
                sans-serif;

            font-size: 23px;

            font-weight: 900;

            letter-spacing: .3px;
        }


        .brand-name span {

            color: #6c35d9;
        }



        /* =========================================
           MAIN DASHBOARD
        ========================================= */

        .dashboard {

            padding:
                32px 16px 50px;

            max-width: 760px;

            margin: auto;
        }


        .welcome-card {

            background: #ffffff;

            border-radius: 22px;

            padding: 30px 23px;

            border:
                1px solid #e4dcf4;

            box-shadow:
                0 10px 30px
                rgba(76, 45, 130, .08);
        }


        .welcome-small {

            color: #7659a9;

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 9px;
        }


        .welcome-title {

            font-size: 34px;

            line-height: 1.2;

            font-weight: 900;

            letter-spacing: -.5px;
        }


        .welcome-title span {

            color: #6c35d9;
        }


        .welcome-text {

            margin-top: 13px;

            color: #6d667c;

            font-size: 18px;

            line-height: 1.55;

            font-weight: 500;
        }



        /* =========================================
           MENU OVERLAY
        ========================================= */

        .menu-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(15, 10, 25, .48);

            z-index: 200;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;
        }


        .menu-overlay.active {

            opacity: 1;

            visibility: visible;
        }



        /* =========================================
           SIDE MENU
        ========================================= */

        .side-menu {

            position: absolute;

            top: 0;

            left: 0;

            width: min(94%, 430px);

            height: 100%;

            background: #6428c7;

            box-shadow:
                10px 0 40px
                rgba(0,0,0,.25);

            transform:
                translateX(-100%);

            transition:
                transform .30s ease;

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }


        .menu-overlay.active
        .side-menu {

            transform:
                translateX(0);
        }



        /* =========================================
           MENU HEADER
        ========================================= */

        .menu-top {

            min-height: 78px;

            padding:
                0 18px;

            border-bottom:
                1px solid
                rgba(255,255,255,.18);

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #5720b4;
        }


        .menu-title {

            font-size: 25px;

            font-weight: 900;

            color: #ffffff;

            letter-spacing: .2px;
        }


        .close-button {

            width: 48px;

            height: 48px;

            border: 0;

            border-radius: 13px;

            background:
                rgba(255,255,255,.14);

            color: #ffffff;

            font-size: 34px;

            line-height: 1;

            cursor: pointer;
        }



        /* =========================================
           PROFILE
        ========================================= */

        .profile-section {

            padding:
                22px 18px;

            background:
                #702fd2;

            border-bottom:
                1px solid
                rgba(255,255,255,.18);
        }


        .profile-row {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .profile-photo {

            width: 72px;

            height: 72px;

            flex: 0 0 72px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.20);

            border:
                3px solid
                rgba(255,255,255,.85);

            box-shadow:
                0 4px 14px
                rgba(0,0,0,.15);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ffffff;

            font-size: 27px;

            font-weight: 900;

            overflow: hidden;
        }


        .profile-photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: none;
        }


        .profile-info {

            min-width: 0;

            flex: 1;
        }


        .profile-name {

            font-size: 21px;

            font-weight: 900;

            color: #ffffff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .profile-mobile {

            margin-top: 5px;

            font-size: 16px;

            font-weight: 700;

            color: #ffffff;
        }


        .profile-email {

            margin-top: 4px;

            font-size: 14px;

            font-weight: 600;

            color:
                rgba(255,255,255,.82);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }



        /* =========================================
           MENU CONTENT
        ========================================= */

        .menu-section {

            padding:
                14px 13px 25px;

            overflow-y: auto;

            flex: 1;

            background: #6428c7;
        }


        .menu-label {

            padding:
                8px 10px 13px;

            color:
                rgba(255,255,255,.72);

            font-size: 13px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.3px;
        }



        /* =========================================
           MENU ITEMS
        ========================================= */

        .menu-item {

            width: 100%;

            min-height: 68px;

            border: 0;

            background:
                transparent;

            border-radius: 14px;

            padding:
                10px 12px;

            display: flex;

            align-items: center;

            gap: 14px;

            text-align: left;

            cursor: pointer;

            color: #ffffff;

            font-size: 18px;

            font-weight: 900;

            font-family:
                Verdana,
                Geneva,
                sans-serif;

            transition:
                background .2s ease;
        }


        .menu-item:hover {

            background:
                rgba(255,255,255,.12);
        }


        .menu-icon {

            width: 46px;

            height: 46px;

            flex: 0 0 46px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.16);

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

            font-weight: 900;
        }


        .menu-item-text {

            flex: 1;

            line-height: 1.3;

            color: #ffffff;
        }


        .menu-arrow {

            color:
                rgba(255,255,255,.75);

            font-size: 30px;

            font-weight: 500;
        }



        /* =========================================
           RED DIVIDER
        ========================================= */

        .red-divider {

            width: 100%;

            height: 8px;

            background: #e53935;

            border-radius: 8px;

            margin:
                10px 0 12px;

            box-shadow:
                0 2px 8px
                rgba(229,57,53,.30);
        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .top-header {

                height: 74px;

                padding:
                    0 12px;
            }


            .menu-button {

                width: 58px;

                height: 58px;

                margin-right: 11px;
            }


            .menu-button span {

                width: 32px;

                height: 4px;
            }


            .brand-name {

                font-size: 20px;
            }


            .brand-logo {

                width: 43px;

                height: 43px;
            }


            .dashboard {

                padding:
                    24px 14px 45px;
            }


            .welcome-card {

                padding:
                    27px 20px;
            }


            .welcome-small {

                font-size: 16px;
            }


            .welcome-title {

                font-size: 31px;
            }


            .welcome-text {

                font-size: 17px;
            }


            .side-menu {

                width: 94%;
            }


            .menu-title {

                font-size: 23px;
            }


            .profile-name {

                font-size: 20px;
            }


            .menu-item {

                min-height: 70px;

                font-size: 18px;
            }


            .menu-icon {

                width: 46px;

                height: 46px;

                font-size: 23px;
            }

        }

    </style>

</head>



<body>



<!-- =========================================
     HEADER
========================================= -->

<header class="top-header">


    <!-- HAMBURGER LEFT -->

    <button
        class="menu-button"
        id="openMenu"
        aria-label="Open menu"
    >

        <span></span>

        <span></span>

        <span></span>

    </button>



    <!-- BRAND -->

    <div class="brand">

        <div class="brand-logo">
            CP
        </div>

        <div class="brand-name">
            CRICK<span>PULSE</span>
        </div>

    </div>


</header>



<!-- =========================================
     DASHBOARD
========================================= -->

<main class="dashboard">


    <section class="welcome-card">

        <div class="welcome-small">
            Welcome to
        </div>


        <h1 class="welcome-title">
            CRICK<span>PULSE</span>
        </h1>


        <p class="welcome-text">
            Your cricket journey starts here.
        </p>

    </section>


</main>



<!-- =========================================
     SIDE MENU
========================================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
>


    <aside class="side-menu">


        <!-- MENU HEADER -->

        <div class="menu-top">

            <div class="menu-title">
                CRICKPULSE
            </div>


            <button
                class="close-button"
                id="closeMenu"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>



        <!-- PROFILE -->

        <section class="profile-section">


            <div class="profile-row">


                <div class="profile-photo">

                    <img
                        id="profilePhoto"
                        src=""
                        alt="Player"
                    >


                    <span id="profileInitial">
                        P
                    </span>

                </div>



                <div class="profile-info">


                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        Player Name
                    </div>


                    <div
                        class="profile-mobile"
                        id="profileMobile"
                    >
                        Mobile Number
                    </div>


                    <div
                        class="profile-email"
                        id="profileEmail"
                    >
                        Gmail / Email
                    </div>


                </div>

            </div>

        </section>



        <!-- MENU -->

        <section class="menu-section">


            <div class="menu-label">
                MENU
            </div>



            <!-- 1 -->

            <button
                class="menu-item"
                type="button"
                id="addTournamentBtn"
            >

                <div class="menu-icon">
                    🏆
                </div>


                <div class="menu-item-text">
                    Add a Tournament / Series
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 2 -->

            <button
                class="menu-item"
                type="button"
                id="newMatchBtn"
            >

                <div class="menu-icon">
                    🏏
                </div>


                <div class="menu-item-text">
                    Start a New Match
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- RED DIVIDER -->

            <div class="red-divider"></div>



            <!-- 3 -->

            <button
                class="menu-item"
                type="button"
                id="myCricketBtn"
            >

                <div class="menu-icon">
                    👤
                </div>


                <div class="menu-item-text">
                    My Cricket
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 4 -->

            <button
                class="menu-item"
                type="button"
                id="contactBtn"
            >

                <div class="menu-icon">
                    💬
                </div>


                <div class="menu-item-text">
                    Contact
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 5 -->

            <button
                class="menu-item"
                type="button"
                id="shareBtn"
            >

                <div class="menu-icon">
                    ↗
                </div>


                <div class="menu-item-text">
                    Share the Site / App
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>


        </section>


    </aside>

</div>



<script>


    /* =========================================
       LOGIN CHECK
    ========================================= */

    const loggedIn =
        sessionStorage.getItem(
            "crickpulseLoggedIn"
        );


    if (loggedIn !== "true") {

        window.location.href =
            "auth.html";

    }



    /* =========================================
       PROFILE MOBILE
    ========================================= */

    const mobile =
        sessionStorage.getItem(
            "crickpulseMobile"
        );


    if (mobile) {

        document
            .getElementById("profileMobile")
            .textContent = mobile;

    }



    /* =========================================
       HAMBURGER
    ========================================= */

    const openMenu =
        document.getElementById(
            "openMenu"
        );


    const closeMenu =
        document.getElementById(
            "closeMenu"
        );


    const menuOverlay =
        document.getElementById(
            "menuOverlay"
        );


    openMenu.addEventListener(
        "click",
        function () {

            menuOverlay.classList.add(
                "active"
            );

        }
    );


    closeMenu.addEventListener(
        "click",
        function () {

            menuOverlay.classList.remove(
                "active"
            );

        }
    );



    /* =========================================
       CLOSE OUTSIDE
    ========================================= */

    menuOverlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target === menuOverlay
            ) {

                menuOverlay.classList.remove(
                    "active"
                );

            }

        }
    );



    /* =========================================
       MENU BUTTONS
    ========================================= */

    document
        .getElementById("addTournamentBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Add Tournament / Series"
                );

            }
        );


    document
        .getElementById("newMatchBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Start New Match"
                );

            }
        );


    document
        .getElementById("myCricketBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "My Cricket"
                );

            }
        );


    document
        .getElementById("contactBtn")
        .addEventListener(
            "click",
            function () {

                console.log(
                    "Contact"
                );

            }
        );



    /* =========================================
       SHARE
    ========================================= */

    document
        .getElementById("shareBtn")
        .addEventListener(
            "click",
            async function () {


                const shareData = {

                    title:
                        "CRICKPULSE",

                    text:
                        "Join me on CRICKPULSE.",

                    url:
                        window.location.origin

                };


                if (
                    navigator.share
                ) {

                    try {

                        await navigator.share(
                            shareData
                        );

                    } catch (error) {

                        console.log(
                            "Share cancelled."
                        );

                    }

                } else {

                    try {

                        await navigator.clipboard.writeText(
                            window.location.origin
                        );


                        alert(
                            "CRICKPULSE link copied."
                        );

                    } catch (error) {

                        alert(
                            "Please copy the site link manually."
                        );

                    }

                }

            }
        );



    console.log(
        "CRICKPULSE dashboard loaded."
    );


</script>


</body>

</html>
