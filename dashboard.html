<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="CRICKPULSE - Dashboard"
>

<title>CRICKPULSE | Home</title>


<style>

/* =================================================
   RESET
================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    font-family:
        Verdana,
        Geneva,
        sans-serif;

    background: #f7f5ff;

    color: #171225;

    min-height: 100vh;
}


/* =================================================
   HEADER
================================================= */

.top-header {

    height: 82px;

    background: #ffffff;

    border-bottom: 1px solid #e4ddf2;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    padding: 0 15px;

    position: sticky;

    top: 0;

    z-index: 100;
}


/* =================================================
   LARGE LEFT HAMBURGER
================================================= */

.menu-button {

    width: 66px;

    height: 66px;

    border: none;

    background: #eee7ff;

    border-radius: 12px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;

    cursor: pointer;

    flex-shrink: 0;

    margin-right: 15px;
}


.menu-button span {

    width: 39px;

    height: 6px;

    background: #6328c7;

    border-radius: 3px;

    display: block;
}


/* =================================================
   BRAND
================================================= */

.brand {

    display: flex;

    align-items: center;

    gap: 13px;
}


.brand-logo {

    width: 52px;

    height: 52px;

    background: #6c35d9;

    color: #ffffff;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 22px;

    font-weight: 900;
}


.brand-name {

    font-size: 30px;

    font-weight: 900;

    letter-spacing: .3px;
}


.brand-name span {

    color: #6c35d9;
}


/* =================================================
   DASHBOARD
================================================= */

.dashboard {

    max-width: 760px;

    margin: auto;

    padding:
        38px 16px 55px;
}


.welcome-card {

    background: #ffffff;

    border:
        1px solid #e2daf2;

    border-radius: 20px;

    padding:
        38px 28px;

    box-shadow:
        0 10px 30px
        rgba(76,45,130,.08);
}


.welcome-small {

    color: #7659a9;

    font-size: 27px;

    font-weight: 700;

    margin-bottom: 12px;
}


.welcome-title {

    font-size: 54px;

    line-height: 1.2;

    font-weight: 900;
}


.welcome-title span {

    color: #6c35d9;
}


.welcome-text {

    margin-top: 17px;

    color: #6d667c;

    font-size: 28px;

    line-height: 1.6;

    font-weight: 500;
}


/* =================================================
   OVERLAY
================================================= */

.menu-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(10,5,20,.55);

    z-index: 200;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}


.menu-overlay.active {

    opacity: 1;

    visibility: visible;
}


/* =================================================
   SIDE MENU
================================================= */

.side-menu {

    position: absolute;

    top: 0;

    left: 0;

    width: min(95%, 455px);

    height: 100%;

    background: #6428c7;

    box-shadow:
        10px 0 40px
        rgba(0,0,0,.30);

    transform:
        translateX(-100%);

    transition:
        transform .30s ease;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


.menu-overlay.active
.side-menu {

    transform:
        translateX(0);
}


/* =================================================
   MENU HEADER
================================================= */

.menu-top {

    min-height: 84px;

    padding:
        0 18px;

    background: #5420ad;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        2px solid
        rgba(255,255,255,.18);
}


.menu-title {

    color: #ffffff;

    font-size: 36px;

    font-weight: 900;
}


.close-button {

    width: 56px;

    height: 56px;

    border: none;

    background:
        rgba(255,255,255,.14);

    color: #ffffff;

    border-radius: 8px;

    font-size: 45px;

    cursor: pointer;

    line-height: 1;
}


/* =================================================
   PROFILE
================================================= */

.profile-section {

    padding:
        27px 18px;

    background: #7132d2;

    border-bottom:
        2px solid
        rgba(255,255,255,.18);
}


.profile-row {

    display: flex;

    align-items: center;

    gap: 18px;
}


.profile-photo {

    width: 82px;

    height: 82px;

    flex: 0 0 82px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.18);

    border:
        3px solid #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #ffffff;

    font-size: 44px;

    font-weight: 900;

    overflow: hidden;
}


.profile-photo img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: none;
}


.profile-info {

    min-width: 0;

    flex: 1;
}


.profile-name {

    color: #ffffff;

    font-size: 33px;

    font-weight: 900;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.profile-mobile {

    margin-top: 8px;

    color: #ffffff;

    font-size: 26px;

    font-weight: 700;
}


.profile-email {

    margin-top: 6px;

    color:
        rgba(255,255,255,.85);

    font-size: 23px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =================================================
   MENU AREA
================================================= */

.menu-section {

    flex: 1;

    overflow-y: auto;

    padding:
        18px 14px 32px;

    background: #6428c7;
}


.menu-label {

    padding:
        8px 8px 18px;

    color:
        rgba(255,255,255,.80);

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 2px;
}


/* =================================================
   EVERY MENU ITEM
   RED OUTLINE ONLY
================================================= */

.menu-item {

    width: 100%;

    min-height: 88px;

    margin-bottom: 16px;

    padding:
        13px 15px;

    border:
        4px solid #ff3b30;

    border-radius: 5px;

    /* NO RED BACKGROUND */

    background:
        rgba(255,255,255,.04);

    color: #ffffff;

    display: flex;

    align-items: center;

    gap: 18px;

    text-align: left;

    cursor: pointer;

    font-family:
        Verdana,
        Geneva,
        sans-serif;

    font-size: 33px;

    font-weight: 900;

    line-height: 1.25;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,.15);

    transition:
        transform .15s ease,
        background .15s ease;
}


.menu-item:active {

    transform: scale(.98);

    background:
        rgba(255,59,48,.15);
}


.menu-icon {

    width: 60px;

    height: 60px;

    flex: 0 0 60px;

    background:
        rgba(255,255,255,.12);

    border:
        2px solid
        rgba(255,255,255,.35);

    border-radius: 5px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #ffffff;

    font-size: 42px;

    font-weight: 900;
}


.menu-item-text {

    flex: 1;

    color: #ffffff;

    font-size: 33px;

    font-weight: 900;

    line-height: 1.3;
}


.menu-arrow {

    color: #ffffff;

    font-size: 51px;

    font-weight: 900;

    flex-shrink: 0;
}


/* =================================================
   MOBILE
================================================= */

@media (max-width: 480px) {

    .top-header {

        height: 82px;

        padding: 0 11px;
    }


    .menu-button {

        width: 64px;

        height: 64px;

        margin-right: 11px;
    }


    .menu-button span {

        width: 38px;

        height: 6px;
    }


    .brand-logo {

        width: 49px;

        height: 49px;

        font-size: 20px;
    }


    .brand-name {

        font-size: 27px;
    }


    .dashboard {

        padding:
            29px 14px 50px;
    }


    .welcome-small {

        font-size: 25px;
    }


    .welcome-title {

        font-size: 50px;
    }


    .welcome-text {

        font-size: 27px;
    }


    .side-menu {

        width: 96%;
    }


    .menu-title {

        font-size: 36px;
    }


    .menu-item {

        min-height: 90px;

        font-size: 31px;

        padding:
            13px 14px;
    }


    .menu-item-text {

        font-size: 31px;
    }


    .menu-icon {

        width: 58px;

        height: 58px;

        font-size: 39px;
    }


    .menu-arrow {

        font-size: 48px;
    }

}


/* =================================================
   SMALL MOBILE
================================================= */

@media (max-width: 380px) {

    .brand-name {

        font-size: 23px;
    }


    .welcome-title {

        font-size: 44px;
    }


    .welcome-text {

        font-size: 24px;
    }


    .menu-item {

        min-height: 86px;
    }


    .menu-item-text {

        font-size: 27px;
    }


    .menu-icon {

        width: 53px;

        height: 53px;

        font-size: 35px;
    }


    .menu-arrow {

        font-size: 43px;
    }

}

</style>

</head>


<body>


<!-- =================================================
     HEADER
================================================= -->

<header class="top-header">


    <!-- LEFT HAMBURGER -->

    <button
        class="menu-button"
        id="openMenu"
        aria-label="Open menu"
    >

        <span></span>

        <span></span>

        <span></span>

    </button>


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-logo">
            CP
        </div>

        <div class="brand-name">
            CRICK<span>PULSE</span>
        </div>

    </div>


</header>



<!-- =================================================
     DASHBOARD
================================================= -->

<main class="dashboard">


    <section class="welcome-card">

        <div class="welcome-small">
            Welcome to
        </div>


        <h1 class="welcome-title">
            CRICK<span>PULSE</span>
        </h1>


        <p class="welcome-text">
            Your cricket journey starts here.
        </p>

    </section>


</main>



<!-- =================================================
     SIDE MENU
================================================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
>


    <aside class="side-menu">


        <!-- MENU HEADER -->

        <div class="menu-top">

            <div class="menu-title">
                CRICKPULSE
            </div>


            <button
                class="close-button"
                id="closeMenu"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>



        <!-- PROFILE -->

        <section class="profile-section">

            <div class="profile-row">


                <div class="profile-photo">

                    <img
                        id="profilePhoto"
                        src=""
                        alt="Player"
                    >

                    <span id="profileInitial">
                        P
                    </span>

                </div>


                <div class="profile-info">

                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        Player Name
                    </div>


                    <div
                        class="profile-mobile"
                        id="profileMobile"
                    >
                        Mobile Number
                    </div>


                    <div
                        class="profile-email"
                        id="profileEmail"
                    >
                        Gmail / Email
                    </div>

                </div>


            </div>

        </section>



        <!-- MENU -->

        <section class="menu-section">


            <div class="menu-label">
                MENU
            </div>



            <!-- 1 -->

            <button
                class="menu-item"
                type="button"
                id="addTournamentBtn"
            >

                <div class="menu-icon">
                    🏆
                </div>


                <div class="menu-item-text">
                    Add a Tournament / Series
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 2 -->

            <button
                class="menu-item"
                type="button"
                id="newMatchBtn"
            >

                <div class="menu-icon">
                    🏏
                </div>


                <div class="menu-item-text">
                    Start a New Match
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 3 -->

            <button
                class="menu-item"
                type="button"
                id="myCricketBtn"
            >

                <div class="menu-icon">
                    👤
                </div>


                <div class="menu-item-text">
                    My Cricket
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 4 -->

            <button
                class="menu-item"
                type="button"
                id="contactBtn"
            >

                <div class="menu-icon">
                    💬
                </div>


                <div class="menu-item-text">
                    Contact
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>



            <!-- 5 -->

            <button
                class="menu-item"
                type="button"
                id="shareBtn"
            >

                <div class="menu-icon">
                    ↗
                </div>


                <div class="menu-item-text">
                    Share the Site / App
                </div>


                <div class="menu-arrow">
                    ›
                </div>

            </button>


        </section>


    </aside>

</div>



<script>

/* =================================================
   LOGIN CHECK
================================================= */

const loggedIn =
    sessionStorage.getItem(
        "crickpulseLoggedIn"
    );


if (loggedIn !== "true") {

    window.location.href =
        "auth.html";
}



/* =================================================
   PROFILE MOBILE
================================================= */

const mobile =
    sessionStorage.getItem(
        "crickpulseMobile"
    );


if (mobile) {

    document
        .getElementById("profileMobile")
        .textContent = mobile;

}



/* =================================================
   MENU
================================================= */

const openMenu =
    document.getElementById(
        "openMenu"
    );


const closeMenu =
    document.getElementById(
        "closeMenu"
    );


const menuOverlay =
    document.getElementById(
        "menuOverlay"
    );


openMenu.addEventListener(
    "click",
    function () {

        menuOverlay.classList.add(
            "active"
        );

    }
);


closeMenu.addEventListener(
    "click",
    function () {

        menuOverlay.classList.remove(
            "active"
        );

    }
);


/* =================================================
   CLOSE OUTSIDE MENU
================================================= */

menuOverlay.addEventListener(
    "click",
    function (event) {

        if (
            event.target === menuOverlay
        ) {

            menuOverlay.classList.remove(
                "active"
            );

        }

    }
);



/* =================================================
   MENU BUTTONS
================================================= */

document
    .getElementById("addTournamentBtn")
    .addEventListener(
        "click",
        function () {

            console.log(
                "Add Tournament / Series"
            );

        }
    );


document
    .getElementById("newMatchBtn")
    .addEventListener(
        "click",
        function () {

            console.log(
                "Start New Match"
            );

        }
    );


document
    .getElementById("myCricketBtn")
    .addEventListener(
        "click",
        function () {

            console.log(
                "My Cricket"
            );

        }
    );


document
    .getElementById("contactBtn")
    .addEventListener(
        "click",
        function () {

            console.log(
                "Contact"
            );

        }
    );



/* =================================================
   SHARE
================================================= */

document
    .getElementById("shareBtn")
    .addEventListener(
        "click",
        async function () {


            const shareData = {

                title:
                    "CRICKPULSE",

                text:
                    "Join me on CRICKPULSE.",

                url:
                    window.location.origin

            };


            if (
                navigator.share
            ) {

                try {

                    await navigator.share(
                        shareData
                    );

                } catch (error) {

                    console.log(
                        "Share cancelled."
                    );

                }

            } else {

                try {

                    await navigator.clipboard.writeText(
                        window.location.origin
                    );


                    alert(
                        "CRICKPULSE link copied."
                    );

                } catch (error) {

                    alert(
                        "Please copy the site link manually."
                    );

                }

            }

        }
    );


console.log(
    "CRICKPULSE dashboard loaded."
);

</script>


</body>

</html>
