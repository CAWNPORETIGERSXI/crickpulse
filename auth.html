<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CRICKPULSE - Login"
    >

    <title>CRICKPULSE | Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .auth-page {

            min-height: calc(100vh - 72px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 16px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,136,0,.12),
                    transparent 55%
                ),
                #050505;
        }

        .auth-card {

            width: 100%;

            max-width: 440px;

            padding: 32px 22px;

            background: #101010;

            border: 1px solid
                rgba(255,136,0,.30);

            border-radius: 18px;

            box-shadow:
                0 0 35px
                rgba(255,136,0,.08);

            text-align: center;
        }

        .auth-logo {

            width: 62px;

            height: 62px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ff8800;

            color: #050505;

            border-radius: 14px;

            font-size: 21px;

            font-weight: 900;
        }

        .auth-card h1 {

            margin: 0;

            font-size: 28px;

            font-weight: 900;
        }

        .auth-card h1 span {

            color: #ff8800;
        }

        .subtitle {

            margin: 9px 0 28px;

            color: #a9a9a9;

            font-size: 14px;
        }

        .auth-label {

            display: block;

            margin: 14px 0 8px;

            color: #fff;

            font-size: 13px;

            font-weight: 700;

            text-align: left;
        }

        .auth-input {

            width: 100%;

            padding: 14px 13px;

            background: #050505;

            border: 1px solid #333;

            border-radius: 8px;

            color: #fff;

            font-size: 16px;

            outline: none;

            box-sizing: border-box;
        }

        .auth-input:focus {

            border-color: #ff8800;

            box-shadow:
                0 0 0 2px
                rgba(255,136,0,.08);
        }

        .pin-input {

            text-align: center;

            letter-spacing: 8px;

            font-size: 22px;

            font-weight: 800;
        }

        .auth-btn {

            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: 0;

            border-radius: 8px;

            background: #ff8800;

            color: #050505;

            font-size: 14px;

            font-weight: 900;

            cursor: pointer;
        }

        .auth-btn:disabled {

            opacity: .55;

            cursor: not-allowed;
        }

        .secondary-btn {

            width: 100%;

            margin-top: 10px;

            padding: 13px;

            border: 1px solid #333;

            border-radius: 8px;

            background: transparent;

            color: #fff;

            font-weight: 800;

            cursor: pointer;
        }

        .link-btn {

            margin-top: 15px;

            border: 0;

            background: transparent;

            color: #ff8800;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;
        }

        .message {

            min-height: 20px;

            margin-top: 18px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {

            color: #ff4a4a;
        }

        .message.success {

            color: #55d66a;
        }

        .hidden {

            display: none;
        }

        .security-note {

            margin-top: 25px;

            color: #666;

            font-size: 11px;

            line-height: 1.5;
        }

        .back-home {

            display: inline-block;

            margin-top: 20px;

            color: #999;

            text-decoration: none;

            font-size: 12px;
        }

        .back-home:hover {

            color: #ff8800;
        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-mark">
                CP
            </div>

            <div class="brand-text">

                <h1>
                    CRICKPULSE
                </h1>

                <span>
                    Your Cricket. Your Pulse.
                </span>

            </div>

        </a>

    </div>

</header>



<main class="auth-page">

    <div class="auth-card">


        <div class="auth-logo">
            CP
        </div>


        <h1>
            CRICK<span>PULSE</span>
        </h1>



        <!-- ===============================
             LOGIN
        ================================= -->

        <section id="loginBox">

            <p class="subtitle">
                Login to your CRICKPULSE account
            </p>


            <label
                class="auth-label"
                for="loginMobile"
            >
                Mobile Number
            </label>


            <input
                id="loginMobile"
                class="auth-input"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="Enter mobile number"
                autocomplete="tel"
            >


            <label
                class="auth-label"
                for="loginPin"
            >
                4-Digit PIN
            </label>


            <input
                id="loginPin"
                class="auth-input pin-input"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                autocomplete="current-password"
            >


            <button
                id="loginBtn"
                class="auth-btn"
                type="button"
            >
                LOGIN
            </button>


            <button
                id="forgotPinBtn"
                class="link-btn"
                type="button"
            >
                Forgot PIN?
            </button>


            <button
                id="createAccountBtn"
                class="secondary-btn"
                type="button"
            >
                CREATE NEW ACCOUNT
            </button>

        </section>



        <!-- ===============================
             REGISTER
        ================================= -->

        <section
            id="registerBox"
            class="hidden"
        >

            <p class="subtitle">
                Create your CRICKPULSE account
            </p>


            <label
                class="auth-label"
                for="registerMobile"
            >
                Mobile Number
            </label>


            <input
                id="registerMobile"
                class="auth-input"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="Enter mobile number"
            >


            <label
                class="auth-label"
                for="registerEmail"
            >
                Gmail / Email
            </label>


            <input
                id="registerEmail"
                class="auth-input"
                type="email"
                placeholder="example@gmail.com"
                autocomplete="email"
            >


            <label
                class="auth-label"
                for="registerPin"
            >
                Create 4-Digit PIN
            </label>


            <input
                id="registerPin"
                class="auth-input pin-input"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
            >


            <label
                class="auth-label"
                for="confirmPin"
            >
                Confirm 4-Digit PIN
            </label>


            <input
                id="confirmPin"
                class="auth-input pin-input"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
            >


            <button
                id="registerBtn"
                class="auth-btn"
                type="button"
            >
                CREATE ACCOUNT
            </button>


            <button
                id="backLoginBtn"
                class="secondary-btn"
                type="button"
            >
                BACK TO LOGIN
            </button>

        </section>



        <!-- ===============================
             FORGOT PIN
        ================================= -->

        <section
            id="forgotBox"
            class="hidden"
        >

            <p class="subtitle">

                Enter your registered Gmail.
                Recovery will be available here.

            </p>


            <label
                class="auth-label"
                for="forgotEmail"
            >
                Registered Gmail / Email
            </label>


            <input
                id="forgotEmail"
                class="auth-input"
                type="email"
                placeholder="example@gmail.com"
                autocomplete="email"
            >


            <button
                id="resetBtn"
                class="auth-btn"
                type="button"
            >
                SEND RECOVERY EMAIL
            </button>


            <button
                id="forgotBackBtn"
                class="secondary-btn"
                type="button"
            >
                BACK TO LOGIN
            </button>

        </section>



        <div
            id="message"
            class="message"
        ></div>


        <p class="security-note">

            Your recovery email is used only
            for account recovery.

        </p>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to CRICKPULSE
        </a>

    </div>

</main>



<script>

    /* =====================================
       ELEMENTS
    ====================================== */

    const loginBox =
        document.getElementById(
            "loginBox"
        );

    const registerBox =
        document.getElementById(
            "registerBox"
        );

    const forgotBox =
        document.getElementById(
            "forgotBox"
        );

    const message =
        document.getElementById(
            "message"
        );



    /* =====================================
       MESSAGE
    ====================================== */

    function showMessage(
        text,
        type = ""
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;
    }



    /* =====================================
       DIGITS ONLY
    ====================================== */

    function onlyDigits(input) {

        input.value =
            input.value.replace(
                /\D/g,
                ""
            );
    }



    /* =====================================
       LOGIN
    ====================================== */

    document
        .getElementById("loginBtn")
        .addEventListener(
            "click",
            async function () {

                const mobile =
                    document
                    .getElementById(
                        "loginMobile"
                    )
                    .value
                    .trim();

                const pin =
                    document
                    .getElementById(
                        "loginPin"
                    )
                    .value
                    .trim();


                if (
                    !/^[6-9]\d{9}$/.test(
                        mobile
                    )
                ) {

                    showMessage(
                        "Please enter a valid 10-digit mobile number.",
                        "error"
                    );

                    return;
                }


                if (
                    !/^\d{4}$/.test(pin)
                ) {

                    showMessage(
                        "Please enter your 4-digit PIN.",
                        "error"
                    );

                    return;
                }


                showMessage(
                    "Logging in...",
                    ""
                );


                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        mobile,
                                        pin
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.message ||
                            "Unable to login.",
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        "Login successful.",
                        "success"
                    );


                    /*
                     * Temporary successful-login action.
                     * Later we can redirect to dashboard.
                     */

                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        800
                    );


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }

            }
        );



    /* =====================================
       CREATE ACCOUNT
    ====================================== */

    document
        .getElementById("registerBtn")
        .addEventListener(
            "click",
            async function () {

                const mobile =
                    document
                    .getElementById(
                        "registerMobile"
                    )
                    .value
                    .trim();

                const email =
                    document
                    .getElementById(
                        "registerEmail"
                    )
                    .value
                    .trim();

                const pin =
                    document
                    .getElementById(
                        "registerPin"
                    )
                    .value
                    .trim();

                const confirmPin =
                    document
                    .getElementById(
                        "confirmPin"
                    )
                    .value
                    .trim();


                if (
                    !/^[6-9]\d{9}$/.test(
                        mobile
                    )
                ) {

                    showMessage(
                        "Please enter a valid 10-digit mobile number.",
                        "error"
                    );

                    return;
                }


                if (
                    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                        email
                    )
                ) {

                    showMessage(
                        "Please enter a valid Gmail/email address.",
                        "error"
                    );

                    return;
                }


                if (
                    !/^\d{4}$/.test(pin)
                ) {

                    showMessage(
                        "PIN must contain exactly 4 digits.",
                        "error"
                    );

                    return;
                }


                if (
                    pin !== confirmPin
                ) {

                    showMessage(
                        "PIN and Confirm PIN do not match.",
                        "error"
                    );

                    return;
                }


                showMessage(
                    "Creating account...",
                    ""
                );


                try {

                    const response =
                        await fetch(
                            "/api/register",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        mobile,
                                        email,
                                        pin
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.message ||
                            "Unable to create account.",
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        "Account created successfully. Please login.",
                        "success"
                    );


                    /*
                     * Clear registration fields
                     */

                    document
                        .getElementById(
                            "registerMobile"
                        )
                        .value = "";

                    document
                        .getElementById(
                            "registerEmail"
                        )
                        .value = "";

                    document
                        .getElementById(
                            "registerPin"
                        )
                        .value = "";

                    document
                        .getElementById(
                            "confirmPin"
                        )
                        .value = "";


                    /*
                     * Return to login
                     */

                    setTimeout(
                        function () {

                            registerBox
                                .classList
                                .add("hidden");

                            forgotBox
                                .classList
                                .add("hidden");

                            loginBox
                                .classList
                                .remove("hidden");

                            showMessage(
                                "Account created successfully. Please login.",
                                "success"
                            );

                        },
                        1000
                    );


                } catch (error) {

                    console.error(
                        "REGISTER ERROR:",
                        error
                    );

                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }

            }
        );



    /* =====================================
       FORGOT PIN
       =====================================

       IMPORTANT:
       OTP/Resend is NOT connected yet.
       We will do that after Login works.
    ====================================== */

    document
        .getElementById("resetBtn")
        .addEventListener(
            "click",
            function () {

                showMessage(
                    "Forgot PIN recovery will be connected next.",
                    "error"
                );

            }
        );



    /* =====================================
       SCREEN SWITCHING
    ====================================== */

    document
        .getElementById(
            "createAccountBtn"
        )
        .addEventListener(
            "click",
            function () {

                loginBox
                    .classList
                    .add("hidden");

                forgotBox
                    .classList
                    .add("hidden");

                registerBox
                    .classList
                    .remove("hidden");

                showMessage(
                    "",
                    ""
                );

            }
        );


    document
        .getElementById(
            "backLoginBtn"
        )
        .addEventListener(
            "click",
            function () {

                registerBox
                    .classList
                    .add("hidden");

                forgotBox
                    .classList
                    .add("hidden");

                loginBox
                    .classList
                    .remove("hidden");

                showMessage(
                    "",
                    ""
                );

            }
        );


    document
        .getElementById(
            "forgotPinBtn"
        )
        .addEventListener(
            "click",
            function () {

                loginBox
                    .classList
                    .add("hidden");

                registerBox
                    .classList
                    .add("hidden");

                forgotBox
                    .classList
                    .remove("hidden");

                showMessage(
                    "",
                    ""
                );

            }
        );


    document
        .getElementById(
            "forgotBackBtn"
        )
        .addEventListener(
            "click",
            function () {

                forgotBox
                    .classList
                    .add("hidden");

                registerBox
                    .classList
                    .add("hidden");

                loginBox
                    .classList
                    .remove("hidden");

                showMessage(
                    "",
                    ""
                );

            }
        );



    /* =====================================
       INPUT RESTRICTIONS
    ====================================== */

    [
        "loginMobile",
        "registerMobile",
        "loginPin",
        "registerPin",
        "confirmPin"
    ]
    .forEach(
        function (id) {

            const input =
                document.getElementById(
                    id
                );

            input.addEventListener(
                "input",
                function () {

                    onlyDigits(this);

                }
            );

        }
    );


    console.log(
        "CRICKPULSE authentication system loaded."
    );

</script>

</body>

</html>
