<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | Tournament List</title>

<style>

/* =================================================
   RESET
================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana,Geneva,sans-serif;
    background:#f7f5ff;
    color:#171225;
}


/* =================================================
   HEADER
================================================= */

.top-header{

    min-height:78px;

    background:#ffffff;

    border-bottom:1px solid #e4ddf2;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 15px;

    position:sticky;
    top:0;

    z-index:1000;
}


.back-button{

    width:52px;
    height:52px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#ffffff;

    color:#6328c7;

    font-size:38px;
    font-weight:900;

    cursor:pointer;
}


.header-title{

    flex:1;

    text-align:center;

    font-size:22px;

    font-weight:900;
}


.header-space{
    width:52px;
}


/* =================================================
   PAGE
================================================= */

.page{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:28px 16px 100px;
}


/* =================================================
   HEADING
================================================= */

.page-heading{
    margin-bottom:22px;
}


.page-heading span{

    display:block;

    color:#6c35d9;

    font-size:12px;

    font-weight:900;

    letter-spacing:1px;
}


.page-heading h1{

    margin-top:7px;

    font-size:28px;

    font-weight:900;
}


.page-heading p{

    margin-top:8px;

    color:#81768e;

    font-size:14px;

    line-height:1.5;
}


/* =================================================
   CONTROL BAR
================================================= */

.control-bar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:18px;
}


.count-box{

    flex:1;

    min-height:52px;

    display:flex;

    align-items:center;

    padding:0 14px;

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    color:#6c35d9;

    font-size:16px;

    font-weight:900;
}


.refresh-button{

    min-height:52px;

    padding:0 18px;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    background:#6c35d9;

    color:#ffffff;

    font-size:15px;

    font-weight:900;

    cursor:pointer;
}


.refresh-button:active{
    transform:scale(.97);
}


/* =================================================
   LOADING
================================================= */

.loading{

    padding:35px 15px;

    text-align:center;

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    color:#6c35d9;

    font-size:17px;

    font-weight:900;
}


/* =================================================
   EMPTY / ERROR
================================================= */

.message-box{

    padding:35px 20px;

    text-align:center;

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:8px;
}


.message-box h2{

    font-size:22px;

    margin-bottom:10px;
}


.message-box p{

    color:#81768e;

    font-size:14px;

    line-height:1.6;
}


/* =================================================
   TOURNAMENT LIST
================================================= */

.tournament-list{

    display:grid;

    gap:16px;
}


/* =================================================
   TOURNAMENT CARD
================================================= */

.tournament-card{

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:10px;

    padding:18px;

    box-shadow:
        0 6px 20px
        rgba(76,45,130,.07);
}


/* =================================================
   CARD TOP
================================================= */

.card-top{

    display:flex;

    align-items:center;

    gap:14px;
}


.logo{

    width:65px;
    height:65px;

    flex-shrink:0;

    border-radius:50%;

    border:1.5px solid #ff3b30;

    background:#f2edff;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#6c35d9;

    font-size:22px;

    font-weight:900;

    overflow:hidden;
}


.logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}


.tournament-info{

    flex:1;

    min-width:0;
}


.tournament-name{

    font-size:20px;

    font-weight:900;

    line-height:1.3;

    word-break:break-word;
}


.tournament-city{

    margin-top:5px;

    color:#81768e;

    font-size:13px;

    font-weight:700;
}


.status{

    padding:6px 9px;

    border-radius:20px;

    background:#f2edff;

    color:#6c35d9;

    font-size:9px;

    font-weight:900;

    white-space:nowrap;
}


/* =================================================
   DETAILS
================================================= */

.card-details{

    margin-top:17px;

    padding-top:14px;

    border-top:1px solid #eee9f5;

    display:grid;

    gap:9px;
}


.detail-row{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;

    font-size:12px;
}


.detail-label{

    color:#8d8498;

    font-weight:700;
}


.detail-value{

    color:#30263e;

    font-weight:900;

    text-align:right;

    word-break:break-word;
}


/* =================================================
   EVENT ID
================================================= */

.event-id-box{

    margin-top:15px;

    padding:12px;

    background:#faf8ff;

    border:1px solid #e5def3;

    border-radius:7px;
}


.event-id-label{

    display:block;

    color:#8d8498;

    font-size:9px;

    font-weight:900;

    margin-bottom:5px;
}


.event-id{

    display:block;

    color:#6c35d9;

    font-family:monospace;

    font-size:12px;

    font-weight:900;

    word-break:break-all;
}


/* =================================================
   FIREBASE STATUS
================================================= */

.firebase-status{

    margin-top:20px;

    padding:13px;

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    color:#35a85b;

    font-size:13px;

    font-weight:900;

    text-align:center;
}


/* =================================================
   MOBILE
================================================= */

@media(max-width:480px){

    .header-title{
        font-size:19px;
    }


    .page{
        padding:24px 14px 100px;
    }


    .page-heading h1{
        font-size:26px;
    }


    .control-bar{
        align-items:stretch;
    }


    .count-box{
        font-size:14px;
    }


    .refresh-button{
        padding:0 14px;
        font-size:13px;
    }


    .tournament-name{
        font-size:18px;
    }


    .logo{
        width:58px;
        height:58px;
    }


    .status{
        font-size:8px;
    }

}

</style>

</head>


<body>


<!-- =================================================
     HEADER
================================================= -->

<header class="top-header">

    <button
        class="back-button"
        id="backButton"
        type="button"
    >
        ‹
    </button>


    <div class="header-title">
        Tournament List
    </div>


    <div class="header-space"></div>

</header>


<!-- =================================================
     MAIN
================================================= -->

<main class="page">


    <div class="page-heading">

        <span>
            FIREBASE VERIFICATION
        </span>

        <h1>
            All Tournaments
        </h1>

        <p>
            सभी Tournament जो Firebase में
            <b>events</b> collection के अंदर
            मौजूद हैं, यहाँ दिखाई देंगे।
        </p>

    </div>


    <!-- =================================================
         CONTROL
    ================================================= -->

    <div class="control-bar">

        <div
            class="count-box"
            id="countBox"
        >
            Loading...
        </div>


        <button
            class="refresh-button"
            id="refreshButton"
            type="button"
        >
            ↻ REFRESH
        </button>

    </div>


    <!-- =================================================
         LOADING
    ================================================= -->

    <div
        class="loading"
        id="loading"
    >
        Connecting to Firebase...
    </div>


    <!-- =================================================
         LIST
    ================================================= -->

    <div
        class="tournament-list"
        id="tournamentList"
        style="display:none;"
    ></div>


    <!-- =================================================
         FIREBASE STATUS
    ================================================= -->

    <div
        class="firebase-status"
        id="firebaseStatus"
        style="display:none;"
    >
        ✓ Firebase connected successfully
    </div>


</main>


<!-- =================================================
     FIREBASE SCRIPT
================================================= -->

<script type="module">


/* =================================================
   FIREBASE
================================================= */

import { db } from "./firebase.js";


import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =================================================
   ELEMENTS
================================================= */

const loading =
    document.getElementById("loading");


const list =
    document.getElementById("tournamentList");


const countBox =
    document.getElementById("countBox");


const refreshButton =
    document.getElementById("refreshButton");


const firebaseStatus =
    document.getElementById("firebaseStatus");


/* =================================================
   BACK
================================================= */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        window.location.href =
            "dashboard.html";

    }
);


/* =================================================
   SAFE HTML
================================================= */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =================================================
   DATE FORMAT
================================================= */

function formatDate(value){

    if(!value){
        return "-";
    }


    const parts =
        String(value).split("-");


    if(parts.length === 3){

        return (
            parts[2] +
            "-" +
            parts[1] +
            "-" +
            parts[0]
        );

    }


    return value;

}


/* =================================================
   LOAD TOURNAMENTS
================================================= */

async function loadTournaments(){


    loading.style.display =
        "block";


    list.style.display =
        "none";


    firebaseStatus.style.display =
        "none";


    list.innerHTML = "";


    countBox.textContent =
        "Loading...";


    try{


        /* ==========================================
           READ EVENTS COLLECTION
        ========================================== */

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "events"
                )
            );


        const tournaments = [];


        /* ==========================================
           FILTER TOURNAMENTS
        ========================================== */

        snapshot.forEach(
            function(doc){

                const data =
                    doc.data();


                if(
                    String(
                        data.eventType || ""
                    ).toLowerCase()
                    ===
                    "tournament"
                ){

                    tournaments.push({

                        id:
                            doc.id,

                        data:
                            data

                    });

                }

            }
        );


        /* ==========================================
           NEWEST FIRST
        ========================================== */

        tournaments.sort(
            function(a,b){

                const aTime =
                    a.data.createdAt &&
                    typeof
                    a.data.createdAt.toMillis
                    ===
                    "function"

                    ? a.data.createdAt.toMillis()

                    : 0;


                const bTime =
                    b.data.createdAt &&
                    typeof
                    b.data.createdAt.toMillis
                    ===
                    "function"

                    ? b.data.createdAt.toMillis()

                    : 0;


                return bTime - aTime;

            }
        );


        /* ==========================================
           COUNT
        ========================================== */

        countBox.textContent =
            "Total Tournaments: " +
            tournaments.length;


        loading.style.display =
            "none";


        firebaseStatus.style.display =
            "block";


        /* ==========================================
           EMPTY
        ========================================== */

        if(
            tournaments.length === 0
        ){

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "message-box";


            empty.innerHTML = `

                <h2>
                    No Tournament Found
                </h2>

                <p>
                    Firebase के
                    <b>events</b> collection में
                    अभी कोई Tournament नहीं मिला।
                    <br><br>
                    अगर आपने Tournament बनाया है,
                    तो हम अगला step में
                    Create Event saving को check करेंगे।
                </p>

            `;


            list.appendChild(
                empty
            );


            list.style.display =
                "grid";


            return;

        }


        /* ==========================================
           CREATE CARDS
        ========================================== */

        tournaments.forEach(
            function(item){

                const data =
                    item.data;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "tournament-card";


                /* ==============================
                   LOGO
                ============================== */

                let logoHTML =
                    "CP";


                if(
                    data.logoUrl
                ){

                    logoHTML = `

                        <img
                            src="${escapeHTML(
                                data.logoUrl
                            )}"
                            alt="Tournament Logo"
                        >

                    `;

                }


                /* ==============================
                   STATUS
                ============================== */

                const status =
                    data.status ||
                    "UPCOMING";


                /* ==============================
                   CARD
                ============================== */

                card.innerHTML = `

                    <div class="card-top">


                        <div class="logo">

                            ${logoHTML}

                        </div>


                        <div
                            class="tournament-info"
                        >

                            <div
                                class="tournament-name"
                            >

                                ${escapeHTML(
                                    data.eventName ||
                                    "Unnamed Tournament"
                                )}

                            </div>


                            <div
                                class="tournament-city"
                            >

                                📍
                                ${escapeHTML(
                                    data.city ||
                                    "-"
                                )}

                            </div>

                        </div>


                        <div class="status">

                            ${escapeHTML(
                                status
                            )}

                        </div>

                    </div>


                    <div class="card-details">


                        <div class="detail-row">

                            <span
                                class="detail-label"
                            >
                                Start Date
                            </span>

                            <span
                                class="detail-value"
                            >
                                ${escapeHTML(
                                    formatDate(
                                        data.startDate
                                    )
                                )}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span
                                class="detail-label"
                            >
                                End Date
                            </span>

                            <span
                                class="detail-value"
                            >
                                ${escapeHTML(
                                    formatDate(
                                        data.endDate
                                    )
                                )}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span
                                class="detail-label"
                            >
                                Ground
                            </span>

                            <span
                                class="detail-value"
                            >
                                ${escapeHTML(
                                    data.ground ||
                                    "-"
                                )}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span
                                class="detail-label"
                            >
                                Category
                            </span>

                            <span
                                class="detail-value"
                            >
                                ${escapeHTML(
                                    data.category ||
                                    "-"
                                )}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span
                                class="detail-label"
                            >
                                Organizer
                            </span>

                            <span
                                class="detail-value"
                            >
                                ${escapeHTML(
                                    data.organizerName ||
                                    "-"
                                )}
                            </span>

                        </div>


                        <div class="detail-row">

                            <span
                                class="detail-label"
                            >
                                Ball
                            </span>

                            <span
                                class="detail-value"
                            >
                                ${escapeHTML(
                                    data.ballType ||
                                    "-"
                                )}
                            </span>

                        </div>


                    </div>


                    <div class="event-id-box">


                        <span
                            class="event-id-label"
                        >
                            FIREBASE EVENT ID
                        </span>


                        <span
                            class="event-id"
                        >

                            ${escapeHTML(
                                item.id
                            )}

                        </span>


                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );


        list.style.display =
            "grid";


    }
    catch(error){


        console.error(
            "TOURNAMENT LOAD ERROR:",
            error
        );


        loading.style.display =
            "none";


        countBox.textContent =
            "Firebase Error";


        const errorBox =
            document.createElement(
                "div"
            );


        errorBox.className =
            "message-box";


        errorBox.innerHTML = `

            <h2>
                Firebase Error
            </h2>

            <p>
                ${escapeHTML(
                    error.message ||
                    "Unable to read events collection."
                )}
            </p>

        `;


        list.appendChild(
            errorBox
        );


        list.style.display =
            "grid";

    }

}


/* =================================================
   REFRESH
================================================= */

refreshButton.addEventListener(
    "click",
    function(){

        loadTournaments();

    }
);


/* =================================================
   START
================================================= */

loadTournaments();


console.log(
    "CRICKPULSE Tournament Verification List Loaded"
);


</script>


</body>

</html>
