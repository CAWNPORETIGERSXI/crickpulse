<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | All Tournaments</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f7f5ff;
    color:#222;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    background:#6d35d9;
    color:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
}

.header h1{
    font-size:26px;
    margin-bottom:8px;
}

.count{
    font-size:20px;
    font-weight:bold;
}

.tournament-card{
    background:white;
    border:1px solid #ff4d4d;
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

.tournament-card h2{
    font-size:21px;
    color:#6d35d9;
    margin-bottom:10px;
}

.info{
    font-size:17px;
    line-height:1.7;
}

.id{
    margin-top:10px;
    padding:10px;
    background:#f1edff;
    border-radius:8px;
    font-size:14px;
    word-break:break-all;
}

.loading{
    text-align:center;
    font-size:18px;
    padding:30px;
}

.error{
    background:#ffe5e5;
    border:1px solid red;
    color:#b00000;
    padding:15px;
    border-radius:10px;
    font-size:16px;
}

.empty{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>CRICKPULSE</h1>

        <div class="count">
            Total Tournaments:
            <span id="totalTournaments">0</span>
        </div>

    </div>

    <div id="status" class="loading">
        Loading tournaments...
    </div>

    <div id="tournamentList"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
====================================================
CRICKPULSE FIREBASE CONFIG
====================================================
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "crickpulse-86857.firebaseapp.com",

    projectId: "crickpulse-86857",

    storageBucket: "crickpulse-86857.appspot.com",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


/*
====================================================
INITIALIZE FIREBASE
====================================================
*/

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/*
====================================================
LOAD TOURNAMENTS
====================================================
*/

async function loadTournaments(){

    const status =
        document.getElementById("status");

    const list =
        document.getElementById("tournamentList");

    const total =
        document.getElementById("totalTournaments");


    try{

        const snapshot =
            await getDocs(
                collection(db, "events")
            );


        const tournaments = [];


        snapshot.forEach((doc) => {

            const data = doc.data();


            /*
            Only Tournament documents
            */

            if(
                data.eventType &&
                String(data.eventType).toLowerCase()
                    === "tournament"
            ){

                tournaments.push({

                    id: doc.id,

                    ...data

                });

            }

        });


        /*
        Sort by creation date
        */

        tournaments.sort((a,b) => {

            const dateA =
                a.createdAt?.seconds || 0;

            const dateB =
                b.createdAt?.seconds || 0;

            return dateB - dateA;

        });


        /*
        Total Tournament Count
        */

        total.textContent =
            tournaments.length;


        status.style.display =
            "none";


        /*
        No tournaments
        */

        if(tournaments.length === 0){

            list.innerHTML = `
                <div class="empty">
                    No tournaments found.
                </div>
            `;

            return;

        }


        /*
        Display tournaments
        */

        list.innerHTML =
            tournaments.map((tournament, index) => {

                const name =
                    tournament.eventName ||
                    tournament.name ||
                    "Unnamed Tournament";


                const category =
                    tournament.category ||
                    "Not Available";


                const ballType =
                    tournament.ballType ||
                    "Not Available";


                const statusText =
                    tournament.status ||
                    "Active";


                return `

                    <div class="tournament-card">

                        <h2>
                            ${index + 1}. ${escapeHtml(name)}
                        </h2>

                        <div class="info">

                            <strong>Category:</strong>
                            ${escapeHtml(category)}
                            <br>

                            <strong>Ball Type:</strong>
                            ${escapeHtml(ballType)}
                            <br>

                            <strong>Status:</strong>
                            ${escapeHtml(statusText)}

                        </div>


                        <div class="id">

                            <strong>Tournament ID:</strong>

                            <br>

                            ${escapeHtml(tournament.id)}

                        </div>

                    </div>

                `;

            }).join("");


    }catch(error){

        console.error(
            "Firebase Error:",
            error
        );


        status.className =
            "error";


        status.innerHTML = `
            Firebase data load failed.<br><br>
            ${escapeHtml(error.message)}
        `;

    }

}


/*
====================================================
HTML SAFETY
====================================================
*/

function escapeHtml(value){

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
====================================================
START
====================================================
*/

loadTournaments();

</script>

</body>

</html>
