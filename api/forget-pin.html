<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CRICKPULSE - Forgot PIN"
    >

    <title>CRICKPULSE - Forgot PIN</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 1px solid #ff8800;
            border-radius: 14px;
            padding: 30px 22px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #ff8800;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1b1b1b;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff8800;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ff8800;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .message {
            text-align: center;
            margin-top: 16px;
            min-height: 20px;
            font-size: 14px;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff8800;
            text-decoration: none;
            font-size: 14px;
        }

        .success {
            color: #00d26a;
        }

        .error {
            color: #ff5555;
        }

    </style>

</head>


<body>

    <div class="forgot-container">

        <div class="logo">
            CRICKPULSE
        </div>

        <div class="subtitle">
            Cricket. Passion. Pulse.
        </div>


        <!-- STEP 1 -->

        <div id="step1">

            <h2>
                Forgot PIN
            </h2>

            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Enter 10-digit mobile number"
                >

            </div>


            <div class="form-group">

                <label>
                    Gmail Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your Gmail address"
                >

            </div>


            <button id="sendOtpBtn">
                Send OTP
            </button>

        </div>


        <!-- STEP 2 -->

        <div id="step2" class="hidden">

            <h2>
                Verify OTP
            </h2>

            <div class="form-group">

                <label>
                    Enter 6-digit OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="Enter OTP"
                >

            </div>


            <button id="verifyOtpBtn">
                Verify OTP
            </button>

        </div>


        <!-- STEP 3 -->

        <div id="step3" class="hidden">

            <h2>
                Create New PIN
            </h2>

            <div class="form-group">

                <label>
                    New 4-digit PIN
                </label>

                <input
                    type="password"
                    id="newPin"
                    maxlength="4"
                    inputmode="numeric"
                    placeholder="Enter new PIN"
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm New PIN
                </label>

                <input
                    type="password"
                    id="confirmPin"
                    maxlength="4"
                    inputmode="numeric"
                    placeholder="Confirm new PIN"
                >

            </div>


            <button id="resetPinBtn">
                Reset PIN
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="login.html"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>


    <script>

        const step1 =
            document.getElementById("step1");

        const step2 =
            document.getElementById("step2");

        const step3 =
            document.getElementById("step3");

        const message =
            document.getElementById("message");


        const sendOtpBtn =
            document.getElementById("sendOtpBtn");

        const verifyOtpBtn =
            document.getElementById("verifyOtpBtn");

        const resetPinBtn =
            document.getElementById("resetPinBtn");


        let mobile = "";
        let email = "";


        function showMessage(text, type = "") {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        // ==========================================
        // SEND OTP
        // ==========================================

        sendOtpBtn.addEventListener(
            "click",
            async function () {

                mobile =
                    document
                        .getElementById("mobile")
                        .value
                        .trim();

                email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                if (!/^[6-9]\d{9}$/.test(mobile)) {

                    showMessage(
                        "Please enter a valid mobile number.",
                        "error"
                    );

                    return;

                }


                if (!email) {

                    showMessage(
                        "Please enter your Gmail address.",
                        "error"
                    );

                    return;

                }


                sendOtpBtn.disabled = true;

                sendOtpBtn.textContent =
                    "Sending OTP...";


                try {

                    const response =
                        await fetch(
                            "/api/send-otp",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        mobile,
                                        email
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to send OTP."
                        );

                    }


                    showMessage(
                        "OTP sent to your Gmail.",
                        "success"
                    );


                    step1.classList.add("hidden");

                    step2.classList.remove("hidden");


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    sendOtpBtn.disabled = false;

                    sendOtpBtn.textContent =
                        "Send OTP";

                }

            }
        );


        // ==========================================
        // VERIFY OTP
        // ==========================================

        verifyOtpBtn.addEventListener(
            "click",
            async function () {

                const otp =
                    document
                        .getElementById("otp")
                        .value
                        .trim();


                if (!/^\d{6}$/.test(otp)) {

                    showMessage(
                        "Please enter the 6-digit OTP.",
                        "error"
                    );

                    return;

                }


                verifyOtpBtn.disabled = true;

                verifyOtpBtn.textContent =
                    "Verifying...";


                try {

                    const response =
                        await fetch(
                            "/api/verify-otp",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        mobile,
                                        otp
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "OTP verification failed."
                        );

                    }


                    showMessage(
                        "OTP verified successfully.",
                        "success"
                    );


                    step2.classList.add("hidden");

                    step3.classList.remove("hidden");


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    verifyOtpBtn.disabled = false;

                    verifyOtpBtn.textContent =
                        "Verify OTP";

                }

            }
        );


        // ==========================================
        // RESET PIN
        // ==========================================

        resetPinBtn.addEventListener(
            "click",
            async function () {

                const newPin =
                    document
                        .getElementById("newPin")
                        .value
                        .trim();

                const confirmPin =
                    document
                        .getElementById("confirmPin")
                        .value
                        .trim();


                if (!/^\d{4}$/.test(newPin)) {

                    showMessage(
                        "PIN must contain exactly 4 digits.",
                        "error"
                    );

                    return;

                }


                if (newPin !== confirmPin) {

                    showMessage(
                        "PINs do not match.",
                        "error"
                    );

                    return;

                }


                resetPinBtn.disabled = true;

                resetPinBtn.textContent =
                    "Resetting PIN...";


                try {

                    const response =
                        await fetch(
                            "/api/reset-pin",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        mobile,
                                        pin: newPin
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to reset PIN."
                        );

                    }


                    showMessage(
                        "PIN reset successfully. You can now login.",
                        "success"
                    );


                    step3.classList.add("hidden");


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        2000
                    );


                } catch (error) {

                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {

                    resetPinBtn.disabled = false;

                    resetPinBtn.textContent =
                        "Reset PIN";

                }

            }
        );

    </script>

</body>

</html>
