<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | Invite Captains</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana,Geneva,sans-serif;
    background:#f7f5ff;
    color:#171225;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.top-header{

    height:82px;

    background:#fff;

    border-bottom:1px solid #e4ddf2;

    display:flex;

    align-items:center;

    padding:0 15px;
}

.back-button{

    width:58px;
    height:58px;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    background:#fff;

    color:#6328c7;

    font-size:42px;

    font-weight:900;

    cursor:pointer;

    flex-shrink:0;
}

.page-title{

    flex:1;

    text-align:center;

    font-size:27px;

    font-weight:900;

    margin-right:58px;
}


/* =========================
   PAGE
========================= */

.page{

    width:100%;

    max-width:760px;

    margin:auto;

    padding:35px 16px 60px;
}


/* =========================
   MAIN CARD
========================= */

.card{

    background:#fff;

    border:1.5px solid #ff3b30;

    border-radius:10px;

    padding:30px 24px;

    box-shadow:
        0 6px 20px rgba(0,0,0,.06);
}

.title{

    font-size:34px;

    font-weight:900;

    margin-bottom:12px;
}

.subtitle{

    font-size:21px;

    color:#6d667c;

    line-height:1.5;

    margin-bottom:28px;
}


/* =========================
   OPTIONS
========================= */

.option{

    width:100%;

    min-height:82px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#fff;

    margin-bottom:16px;

    padding:14px 16px;

    display:flex;

    align-items:center;

    gap:14px;

    cursor:pointer;

    transition:.15s;
}

.option:active{

    transform:scale(.98);
}

.option-icon{

    width:52px;

    height:52px;

    min-width:52px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    color:#6c35d9;

    font-size:25px;

    font-weight:900;
}

.option-content{

    flex:1;

    min-width:0;
}

.option-title{

    font-size:22px;

    font-weight:900;
}

.option-description{

    margin-top:5px;

    font-size:16px;

    color:#6d667c;

    line-height:1.4;
}

.option-arrow{

    font-size:32px;

    color:#6c35d9;

    font-weight:900;
}


/* =========================
   TEAM COUNT
========================= */

.team-count-box{

    margin-top:24px;

    padding:14px;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    background:#fff;
}

.team-count-label{

    font-size:16px;

    font-weight:700;

    color:#6d667c;

    margin-bottom:6px;
}

.team-count-value{

    font-size:21px;

    font-weight:900;

    color:#6328c7;
}


/* =========================
   EVENT ID
========================= */

.event-id-box{

    margin-top:14px;

    padding:14px;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    background:#fff;
}

.event-id-label{

    font-size:16px;

    font-weight:700;

    color:#6d667c;

    margin-bottom:6px;
}

.event-id-value{

    font-size:15px;

    font-weight:800;

    word-break:break-all;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .top-header{

        height:76px;

        padding:0 11px;
    }

    .back-button{

        width:52px;

        height:52px;

        font-size:38px;
    }

    .page-title{

        font-size:23px;

        margin-right:52px;
    }

    .page{

        padding:25px 14px 50px;
    }

    .card{

        padding:27px 18px;
    }

    .title{

        font-size:31px;
    }

    .subtitle{

        font-size:20px;
    }

    .option{

        min-height:78px;

        padding:13px 14px;
    }

    .option-icon{

        width:48px;

        height:48px;

        min-width:48px;
    }

    .option-title{

        font-size:20px;
    }

    .option-description{

        font-size:15px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top-header">

<button
    class="back-button"
    id="backButton"
    type="button"
>
    ‹
</button>

<div class="page-title">
    Invite Captains
</div>

</header>


<!-- =========================
     PAGE
========================= -->

<main class="page">

<section class="card">


<div class="title">
    Add Teams
</div>


<div class="subtitle">
    Invite team captains or add teams manually to this tournament.
</div>


<!-- =========================
     OPTION 1
========================= -->

<div
    class="option"
    id="inviteCaptainOption"
>

<div class="option-icon">
    ↗
</div>

<div class="option-content">

<div class="option-title">
    Invite Captain
</div>

<div class="option-description">
    Send an invitation to team captains to join this tournament.
</div>

</div>

<div class="option-arrow">
    ›
</div>

</div>


<!-- =========================
     OPTION 2
========================= -->

<div
    class="option"
    id="addManuallyOption"
>

<div class="option-icon">
    +
</div>

<div class="option-content">

<div class="option-title">
    Add Manually
</div>

<div class="option-description">
    Add teams yourself using the available team options.
</div>

</div>

<div class="option-arrow">
    ›
</div>

</div>


<!-- =========================
     TEAM COUNT
========================= -->

<div class="team-count-box">

<div class="team-count-label">
    Number of Teams
</div>

<div
    class="team-count-value"
    id="teamCountDisplay"
>
    Loading...
</div>

</div>


<!-- =========================
     EVENT ID
========================= -->

<div class="event-id-box">

<div class="event-id-label">
    Tournament ID
</div>

<div
    class="event-id-value"
    id="eventIdDisplay"
>
    Loading...
</div>

</div>


</section>

</main>


<script>

/* =========================================
   GET URL PARAMETERS
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/* =========================================
   GET EVENT ID
========================================= */

const eventId =
    params.get("eventId") ||
    sessionStorage.getItem(
        "crickpulseEventId"
    );


/* =========================================
   GET TEAM COUNT
========================================= */

const teamCount =
    sessionStorage.getItem(
        "crickpulseTeamCount"
    );


/* =========================================
   ELEMENTS
========================================= */

const eventIdDisplay =
    document.getElementById(
        "eventIdDisplay"
    );

const teamCountDisplay =
    document.getElementById(
        "teamCountDisplay"
    );

const inviteCaptainOption =
    document.getElementById(
        "inviteCaptainOption"
    );

const addManuallyOption =
    document.getElementById(
        "addManuallyOption"
    );

const backButton =
    document.getElementById(
        "backButton"
    );


/* =========================================
   CHECK EVENT ID
========================================= */

if(!eventId){

    alert(
        "Tournament ID is missing. Please create the tournament again."
    );

    window.location.href =
        "create-event.html";

}
else{

    /*
     * IMPORTANT:
     * Same event ID आगे भी रहेगा.
     */

    sessionStorage.setItem(
        "crickpulseEventId",
        eventId
    );

    eventIdDisplay.textContent =
        eventId;

}


/* =========================================
   SHOW TEAM COUNT
========================================= */

if(teamCount){

    teamCountDisplay.textContent =
        teamCount +
        " Teams";

}
else{

    teamCountDisplay.textContent =
        "Not selected";

}


/* =========================================
   BACK BUTTON
========================================= */

backButton.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


/* =========================================
   INVITE CAPTAIN
========================================= */

inviteCaptainOption.addEventListener(
    "click",
    function(){

        if(!eventId){

            alert(
                "Tournament ID is missing."
            );

            return;

        }


        /*
         * अभी Invite Captain का
         * dedicated page अगर मौजूद है
         * तो उसे यहाँ connect किया जा सकता है.
         *
         * फिलहाल tournament eventId
         * सुरक्षित रखा जा रहा है.
         */

        sessionStorage.setItem(
            "crickpulseEventId",
            eventId
        );


        /*
         * यदि आपका अलग
         * captain-invite page है,
         * तो केवल नीचे filename बदलना होगा.
         */

        window.location.href =
            "invite-captain.html?eventId=" +
            encodeURIComponent(
                eventId
            );

    }
);


/* =========================================
   ADD MANUALLY
========================================= */

addManuallyOption.addEventListener(
    "click",
    function(){

        if(!eventId){

            alert(
                "Tournament ID is missing."
            );

            return;

        }


        /*
         * SAME EVENT ID
         *
         * अब यह सीधे
         * add-manually.html खोलेगा.
         *
         * वहाँ आपके 4 options हैं:
         *
         * 1. Invite Link
         * 2. Your Teams
         * 3. Add New Teams
         * 4. Share with QR
         */

        sessionStorage.setItem(
            "crickpulseEventId",
            eventId
        );


        window.location.href =
            "add-manually.html?eventId=" +
            encodeURIComponent(
                eventId
            );

    }
);


/* =========================================
   DEBUG
========================================= */

console.log(
    "CRICKPULSE Invite Captains loaded.",
    {
        eventId:
            eventId,

        teamCount:
            teamCount
    }
);

</script>


</body>

</html>
