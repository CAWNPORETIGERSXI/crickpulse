<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | Invite Captains</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana,Geneva,sans-serif;
    background:#f7f5ff;
    color:#171225;
    min-height:100vh;
}

.top-header{
    height:82px;
    background:#fff;
    border-bottom:1px solid #e4ddf2;

    display:flex;
    align-items:center;

    padding:0 15px;
}

.back-button{
    width:58px;
    height:58px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;
    color:#6328c7;

    font-size:42px;
    font-weight:900;

    cursor:pointer;
}

.page-title{
    flex:1;
    text-align:center;

    font-size:27px;
    font-weight:900;

    margin-right:58px;
}

.page{
    width:100%;
    max-width:760px;

    margin:auto;

    padding:35px 16px 60px;
}

.card{
    background:#fff;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:30px 24px;

    box-shadow:
        0 6px 20px rgba(0,0,0,.06);
}

.title{
    font-size:34px;
    font-weight:900;

    margin-bottom:12px;
}

.subtitle{
    font-size:21px;
    color:#6d667c;

    line-height:1.5;

    margin-bottom:28px;
}

.team-count-box{
    border:1.5px solid #ff3b30;
    border-radius:8px;

    padding:17px;

    margin-bottom:28px;

    background:#fff;
}

.team-count-label{
    font-size:19px;
    font-weight:700;
    color:#6d667c;
}

.team-count-number{
    margin-top:6px;

    font-size:32px;
    font-weight:900;

    color:#6c35d9;
}

.share-button,
.manual-button{
    width:100%;
    min-height:64px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    font-family:Verdana,Geneva,sans-serif;

    font-size:23px;
    font-weight:900;

    cursor:pointer;

    padding:10px 15px;
}

.share-button{
    background:#6c35d9;
    color:#fff;
}

.manual-button{
    background:#fff;
    color:#6c35d9;
}

.share-button:active,
.manual-button:active{
    transform:scale(.98);
}

.or-text{
    text-align:center;

    margin:22px 0;

    font-size:21px;
    font-weight:900;

    color:#6d667c;
}

@media(max-width:480px){

    .top-header{
        height:76px;
        padding:0 11px;
    }

    .back-button{
        width:52px;
        height:52px;
        font-size:38px;
    }

    .page-title{
        font-size:23px;
        margin-right:52px;
    }

    .page{
        padding:25px 14px 50px;
    }

    .card{
        padding:27px 18px;
    }

    .title{
        font-size:31px;
    }

    .subtitle{
        font-size:20px;
    }

    .team-count-label{
        font-size:18px;
    }

    .team-count-number{
        font-size:30px;
    }

    .share-button,
    .manual-button{
        font-size:21px;
    }

    .or-text{
        font-size:20px;
    }

}

</style>

</head>

<body>

<header class="top-header">

<button
    class="back-button"
    id="backButton"
    type="button"
>
‹
</button>

<div class="page-title">
Tournament Setup
</div>

</header>


<main class="page">

<section class="card">

<div class="title">
Invite Captains to Add Teams
</div>

<div class="subtitle">
Invite team captains to add their teams
to this tournament.
</div>


<div class="team-count-box">

<div class="team-count-label">
Total number of teams
</div>

<div
    class="team-count-number"
    id="teamCountDisplay"
>
0
</div>

</div>


<button
    class="share-button"
    id="shareButton"
    type="button"
>
Share with Captains
</button>


<div class="or-text">
OR
</div>


<button
    class="manual-button"
    id="manualButton"
    type="button"
>
Add Manually
</button>

</section>

</main>


<script>

/* =========================================
   GET DATA
========================================= */

const teamCount =
    sessionStorage.getItem(
        "crickpulseTeamCount"
    );

const eventId =
    sessionStorage.getItem(
        "crickpulseEventId"
    );

const eventName =
    sessionStorage.getItem(
        "crickpulseEventName"
    );


/* =========================================
   SHOW COUNT
========================================= */

const teamCountDisplay =
    document.getElementById(
        "teamCountDisplay"
    );


if(!teamCount){

    alert(
        "Team count not found."
    );

    window.location.href =
        "number-of-teams.html";

}
else{

    teamCountDisplay.textContent =
        teamCount;

}


/* =========================================
   BACK
========================================= */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


/* =========================================
   SHARE WITH CAPTAINS
========================================= */

document
.getElementById("shareButton")
.addEventListener(
    "click",
    async function(){

        if(!eventId){

            alert(
                "Tournament ID is missing."
            );

            return;

        }


        /*
           THIS IS THE UNIQUE
           TOURNAMENT LINK
        */

        const inviteLink =
            window.location.origin +
            "/join-team.html?eventId=" +
            encodeURIComponent(
                eventId
            );


        const message =
            "You are invited to add your team to " +
            (
                eventName ||
                "this CRICKPULSE Tournament"
            ) +
            ".\n\n" +
            "Tournament Invite Link:\n" +
            inviteLink;


        const shareData = {

            title:
                eventName ||
                "CRICKPULSE Tournament",

            text:
                message,

            url:
                inviteLink

        };


        if(
            navigator.share
        ){

            try{

                await navigator.share(
                    shareData
                );

            }
            catch(error){

                console.log(
                    "Share cancelled."
                );

            }

        }
        else{

            try{

                await navigator.clipboard.writeText(
                    inviteLink
                );

                alert(
                    "Tournament invite link copied."
                );

            }
            catch(error){

                alert(
                    "Tournament invite link:\n\n" +
                    inviteLink
                );

            }

        }

    }
);


/* =========================================
   ADD MANUALLY
========================================= */

document
.getElementById("manualButton")
.addEventListener(
    "click",
    function(){

        if(!eventId){

            alert(
                "Tournament ID is missing."
            );

            return;

        }


        window.location.href =
            "add-teams.html?eventId=" +
            encodeURIComponent(
                eventId
            );

    }
);


console.log(
    "CRICKPULSE Invite Captains loaded."
);

</script>

</body>

</html>
