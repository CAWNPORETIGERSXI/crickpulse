<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CRICKPULSE | About</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana,Geneva,sans-serif;

    background:
        linear-gradient(
            180deg,
            #f2ecff 0%,
            #faf9ff 45%,
            #ffffff 100%
        );

    color:#171225;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    height:78px;

    background:#ffffff;

    border-bottom:1px solid #ded4f2;

    display:flex;
    align-items:center;

    padding:0 12px;

    position:sticky;
    top:0;
    z-index:1000;
}

.back-btn{
    width:52px;
    height:52px;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    background:#ffffff;

    color:#6c35d9;

    font-size:38px;
    font-weight:900;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.header-title{
    flex:1;

    text-align:center;

    font-size:24px;
    font-weight:900;

    color:#35146d;

    margin-right:52px;
}

/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:760px;

    margin:auto;

    padding:24px 14px 60px;
}

/* =========================
   HERO
========================= */

.hero{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #5420bd,
            #7136dc,
            #9668ff
        );

    border-radius:20px;

    padding:28px 20px;

    color:#ffffff;

    box-shadow:
        0 15px 38px
        rgba(108,53,217,.28);

    margin-bottom:20px;

    text-align:center;
}

.hero::after{

    content:"";

    position:absolute;

    width:190px;
    height:190px;

    right:-90px;
    top:-90px;

    border-radius:50%;

    background:
        rgba(255,255,255,.10);
}

.logo{

    position:relative;
    z-index:2;

    width:110px;
    height:110px;

    margin:0 auto 15px;

    border-radius:50%;

    background:#ffffff;

    border:4px solid
        rgba(255,255,255,.85);

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    color:#6c35d9;

    font-size:22px;
    font-weight:900;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.16);
}

.logo img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.logo-placeholder{
    font-size:20px;
    font-weight:900;
}

.hero h1{

    position:relative;
    z-index:2;

    font-size:28px;
    font-weight:900;

    line-height:1.3;

    margin-bottom:7px;
}

.hero p{

    position:relative;
    z-index:2;

    font-size:16px;

    color:
        rgba(255,255,255,.84);
}

.live-btn{

    position:relative;
    z-index:2;

    margin-top:18px;

    min-width:150px;
    height:50px;

    border:1.5px solid #ffffff;

    border-radius:28px;

    background:
        rgba(255,255,255,.15);

    color:#ffffff;

    font-size:17px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.12);
}

/* =========================
   CARD
========================= */

.card{

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:15px;

    padding:20px;

    margin-bottom:18px;

    box-shadow:
        0 8px 25px
        rgba(72,45,120,.08);
}

.card-head{

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:18px;
}

.card-title{

    font-size:22px;
    font-weight:900;

    color:#35146d;
}

.edit-btn{

    height:44px;

    padding:0 17px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#f0e9ff;

    color:#6c35d9;

    font-size:16px;
    font-weight:900;

    cursor:pointer;
}

.edit-btn:active{
    transform:scale(.97);
}

/* =========================
   DETAILS
========================= */

.detail{

    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:15px;

    padding:14px 0;

    border-bottom:
        1px solid #eee8f8;
}

.detail:last-child{
    border-bottom:none;
}

.detail-label{

    color:#777080;

    font-size:15px;
    font-weight:700;
}

.detail-value{

    text-align:right;

    color:#241536;

    font-size:16px;
    font-weight:900;

    max-width:58%;

    word-break:break-word;
}

/* =========================
   QR CARD
========================= */

.qr-card{

    text-align:center;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #f6f0ff
        );
}

.qr-title{

    font-size:22px;
    font-weight:900;

    color:#35146d;

    margin-bottom:8px;
}

.qr-subtitle{

    font-size:15px;

    color:#777080;

    line-height:1.5;

    margin-bottom:18px;
}

.qr-box{

    width:200px;
    height:200px;

    margin:0 auto 18px;

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:10px;

    box-shadow:
        0 7px 20px
        rgba(108,53,217,.10);
}

#qrImage{

    width:100%;
    height:100%;

    object-fit:contain;

    display:none;
}

.qr-loading{

    color:#6c35d9;

    font-size:15px;
    font-weight:900;
}

.share-btn{

    width:100%;
    height:55px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#6c35d9;

    color:#ffffff;

    font-size:18px;
    font-weight:900;

    cursor:pointer;
}

/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:16px;

    background:
        rgba(30,15,55,.65);

    backdrop-filter:blur(6px);
}

.modal.show{
    display:flex;
}

.modal-box{

    width:100%;
    max-width:600px;

    max-height:90vh;

    overflow-y:auto;

    background:#ffffff;

    border:2px solid #ff3b30;

    border-radius:18px;

    padding:22px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.28);

    animation:
        popupIn .18s ease-out;
}

@keyframes popupIn{

    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modal-head{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.modal-title{

    font-size:24px;
    font-weight:900;

    color:#35146d;
}

.close-btn{

    width:43px;
    height:43px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#ffffff;

    color:#6c35d9;

    font-size:26px;
    font-weight:900;

    cursor:pointer;
}

/* =========================
   FORM
========================= */

.field{

    margin-bottom:17px;
}

.field label{

    display:block;

    margin-bottom:8px;

    font-size:16px;
    font-weight:900;

    color:#2b1943;
}

.field input,
.field select{

    width:100%;
    height:54px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#ffffff;

    padding:0 13px;

    font-family:Verdana,Geneva,sans-serif;

    font-size:17px;
    font-weight:700;

    color:#241536;

    outline:none;
}

.field input:focus,
.field select:focus{

    border-color:#6c35d9;

    box-shadow:
        0 0 0 3px
        rgba(108,53,217,.13);
}

.save-btn{

    width:100%;
    height:57px;

    margin-top:4px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#6c35d9;

    color:#ffffff;

    font-size:18px;
    font-weight:900;

    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
}

/* =========================
   LIVE MODAL
========================= */

.live-message{

    position:fixed;

    inset:0;

    z-index:6000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(28,15,50,.62);

    backdrop-filter:blur(5px);
}

.live-message.show{
    display:flex;
}

.live-box{

    width:100%;
    max-width:420px;

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:17px;

    padding:28px 20px;

    text-align:center;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
}

.live-icon{

    font-size:45px;

    margin-bottom:10px;
}

.live-box h2{

    color:#6c35d9;

    font-size:24px;
    font-weight:900;

    margin-bottom:8px;
}

.live-box p{

    color:#777080;

    font-size:15px;

    line-height:1.5;

    margin-bottom:18px;
}

.live-close{

    width:100%;
    height:50px;

    border:1.5px solid #ff3b30;

    border-radius:8px;

    background:#6c35d9;

    color:#fff;

    font-size:17px;
    font-weight:900;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .header{
        height:74px;
    }

    .back-btn{
        width:50px;
        height:50px;

        font-size:35px;
    }

    .header-title{
        font-size:22px;

        margin-right:50px;
    }

    .page{
        padding:20px 12px 45px;
    }

    .hero{
        padding:25px 15px;
    }

    .hero h1{
        font-size:24px;
    }

    .logo{
        width:100px;
        height:100px;
    }

    .card{
        padding:17px 15px;
    }

    .card-title{
        font-size:20px;
    }

    .detail-label{
        font-size:14px;
    }

    .detail-value{
        font-size:15px;
    }

    .edit-btn{
        height:40px;

        padding:0 14px;

        font-size:15px;
    }

    .modal-box{
        padding:18px 15px;
    }

    .modal-title{
        font-size:21px;
    }

}

</style>

</head>

<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================
   EVENT ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const eventId =
    params.get("eventId") ||
    sessionStorage.getItem(
        "crickpulseEventId"
    );


if(!eventId){

    alert(
        "Tournament ID is missing."
    );

    window.location.href =
        "create-event.html";

    throw new Error(
        "Missing eventId"
    );
}


sessionStorage.setItem(
    "crickpulseEventId",
    eventId
);


/* =========================================
   FIRESTORE REFERENCE
========================================= */

const eventRef =
    doc(
        db,
        "events",
        eventId
    );


/* =========================================
   ELEMENTS
========================================= */

const eventName =
    document.getElementById(
        "eventName"
    );

const eventType =
    document.getElementById(
        "eventType"
    );

const detailName =
    document.getElementById(
        "detailName"
    );

const detailDate =
    document.getElementById(
        "detailDate"
    );

const detailGround =
    document.getElementById(
        "detailGround"
    );

const detailBallType =
    document.getElementById(
        "detailBallType"
    );

const detailCategory =
    document.getElementById(
        "detailCategory"
    );

const eventLogo =
    document.getElementById(
        "eventLogo"
    );

const logoPlaceholder =
    document.getElementById(
        "logoPlaceholder"
    );


/* =========================================
   DATE DISPLAY
========================================= */

function formatDate(value){

    if(!value){
        return "—";
    }

    if(
        typeof value === "string" &&
        value.includes("-")
    ){

        const parts =
            value.split("-");

        if(parts.length === 3){

            return (
                parts[2] +
                "-" +
                parts[1] +
                "-" +
                parts[0]
            );

        }

    }

    return value;
}


/* =========================================
   DATE FOR INPUT
========================================= */

function dateForInput(value){

    if(!value){
        return "";
    }

    if(
        typeof value === "string" &&
        /^\d{4}-\d{2}-\d{2}$/.test(value)
    ){

        return value;

    }

    if(
        typeof value === "string" &&
        /^\d{2}-\d{2}-\d{4}$/.test(value)
    ){

        const parts =
            value.split("-");

        return (
            parts[2] +
            "-" +
            parts[1] +
            "-" +
            parts[0]
        );

    }

    return "";
}


/* =========================================
   LOAD EVENT
========================================= */

async function loadEvent(){

    try{

        const snapshot =
            await getDoc(
                eventRef
            );

        if(!snapshot.exists()){

            alert(
                "Tournament document not found."
            );

            return;
        }


        const data =
            snapshot.data();


        const name =
            data.eventName ||
            data.name ||
            "CRICKPULSE Tournament";


        eventName.textContent =
            name;


        detailName.textContent =
            name;


        eventType.textContent =
            data.eventType ||
            "Tournament";


        const date =
            data.date ||
            data.eventDate ||
            data.startDate ||
            "";


        detailDate.textContent =
            formatDate(date);


        detailGround.textContent =
            data.ground ||
            data.venue ||
            "—";


        detailBallType.textContent =
            data.ballType ||
            "—";


        detailCategory.textContent =
            data.category ||
            "—";


        const logo =
            data.logo ||
            data.eventLogo ||
            data.tournamentLogo ||
            "";


        if(logo){

            eventLogo.src =
                logo;

            eventLogo.style.display =
                "block";

            logoPlaceholder.style.display =
                "none";

        }
        else{

            eventLogo.style.display =
                "none";

            logoPlaceholder.style.display =
                "block";

        }

    }
    catch(error){

        console.error(
            "ABOUT LOAD ERROR:",
            error
        );

        alert(
            "Tournament details load नहीं हो पाए."
        );

    }

}


/* =========================================
   EDIT MODAL
========================================= */

const editModal =
    document.getElementById(
        "editModal"
    );

const editName =
    document.getElementById(
        "editName"
    );

const editDate =
    document.getElementById(
        "editDate"
    );

const editGround =
    document.getElementById(
        "editGround"
    );

const editBallType =
    document.getElementById(
        "editBallType"
    );

const editCategory =
    document.getElementById(
        "editCategory"
    );


/* =========================================
   OPEN EDIT POPUP
========================================= */

document
.getElementById(
    "editButton"
)
.addEventListener(
    "click",
    async function(){

        try{

            const snapshot =
                await getDoc(
                    eventRef
                );


            if(!snapshot.exists()){

                alert(
                    "Tournament not found."
                );

                return;

            }


            const data =
                snapshot.data();


            editName.value =
                data.eventName ||
                data.name ||
                "";


            editDate.value =
                dateForInput(
                    data.date ||
                    data.eventDate ||
                    data.startDate ||
                    ""
                );


            editGround.value =
                data.ground ||
                data.venue ||
                "";


            editBallType.value =
                data.ballType ||
                "";


            editCategory.value =
                data.category ||
                "";


            editModal.classList.add(
                "show"
            );


            document.body.style.overflow =
                "hidden";

        }
        catch(error){

            console.error(
                "EDIT LOAD ERROR:",
                error
            );

            alert(
                "Edit data load नहीं हो पाया."
            );

        }

    }
);


/* =========================================
   CLOSE EDIT POPUP
========================================= */

function closeEditModal(){

    editModal.classList.remove(
        "show"
    );

    document.body.style.overflow =
        "";

}


document
.getElementById(
    "closeModal"
)
.addEventListener(
    "click",
    closeEditModal
);


editModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            editModal
        ){

            closeEditModal();

        }

    }
);


/* =========================================
   ESCAPE KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            editModal.classList.contains("show")
        ){

            closeEditModal();

        }

    }
);


/* =========================================
   SAVE CHANGES
========================================= */

document
.getElementById(
    "saveEditButton"
)
.addEventListener(
    "click",
    async function(){

        const name =
            editName.value.trim();

        const date =
            editDate.value;

        const ground =
            editGround.value.trim();

        const ballType =
            editBallType.value;

        const category =
            editCategory.value;


        if(!name){

            alert(
                "Tournament Name is required."
            );

            editName.focus();

            return;

        }


        const saveButton =
            document.getElementById(
                "saveEditButton"
            );


        saveButton.disabled =
            true;

        saveButton.textContent =
            "SAVING...";


        try{

            await updateDoc(
                eventRef,
                {

                    eventName:
                        name,

                    date:
                        date,

                    ground:
                        ground,

                    ballType:
                        ballType,

                    category:
                        category

                }
            );


            closeEditModal();


            await loadEvent();


            alert(
                "Tournament details updated successfully."
            );

        }
        catch(error){

            console.error(
                "EDIT SAVE ERROR:",
                error
            );

            alert(
                "Details update नहीं हो पाए.\n\n" +
                error.message
            );

        }
        finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "SAVE CHANGES";

        }

    }
);

/* =========================================
   SHARE
========================================= */

document
.getElementById(
    "shareButton"
)
.addEventListener(
    "click",
    async function(){

        const shareData = {

            title:
                eventName.textContent,

            text:
                "Join this CRICKPULSE tournament",

            url:
                tournamentUrl

        };


        if(
            navigator.share
        ){

            try{

                await navigator.share(
                    shareData
                );

            }
            catch(error){

                console.log(
                    "Share cancelled."
                );

            }

            return;

        }


        try{

            await navigator
            .clipboard
            .writeText(
                tournamentUrl
            );

            alert(
                "Tournament link copied."
            );

        }
        catch(error){

            alert(
                tournamentUrl
            );

        }

    }
);
