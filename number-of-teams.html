<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CRICKPULSE | Number of Teams</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana, Geneva, sans-serif;
    background:#f7f5ff;
    color:#171225;
    min-height:100vh;
}

/* HEADER */

.top-header{
    height:82px;
    background:#ffffff;
    border-bottom:1px solid #e4ddf2;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.back-button{
    width:58px;
    height:58px;
    border:2px solid #ff3b30;
    border-radius:8px;
    background:#ffffff;
    color:#6328c7;
    font-size:42px;
    font-weight:900;
    cursor:pointer;
}

.page-title{
    flex:1;
    text-align:center;
    font-size:27px;
    font-weight:900;
    margin-right:58px;
}

/* MAIN */

.page{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:35px 16px 60px;
}

/* CARD */

.card{
    background:#ffffff;
    border:2px solid #ff3b30;
    border-radius:10px;
    padding:30px 24px;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.title{
    font-size:34px;
    font-weight:900;
    margin-bottom:12px;
}

.subtitle{
    font-size:21px;
    color:#6d667c;
    line-height:1.5;
    margin-bottom:30px;
}

/* FIELD */

.field-label{
    display:block;
    font-size:22px;
    font-weight:900;
    margin-bottom:10px;
}

.team-input{
    width:100%;
    height:62px;
    border:2px solid #ff3b30;
    border-radius:8px;
    background:#ffffff;
    padding:0 15px;
    font-family:Verdana, Geneva, sans-serif;
    font-size:24px;
    font-weight:800;
    outline:none;
}

.team-input:focus{
    border-color:#ff3b30;
    box-shadow:0 0 0 3px rgba(255,59,48,.12);
}

/* DONE */

.done-button{
    width:100%;
    height:62px;
    margin-top:28px;
    border:2px solid #ff3b30;
    border-radius:8px;
    background:#6c35d9;
    color:#ffffff;
    font-family:Verdana, Geneva, sans-serif;
    font-size:24px;
    font-weight:900;
    cursor:pointer;
}

.done-button:active{
    transform:scale(.98);
}

/* MOBILE */

@media(max-width:480px){

    .top-header{
        height:76px;
        padding:0 11px;
    }

    .back-button{
        width:52px;
        height:52px;
        font-size:38px;
    }

    .page-title{
        font-size:23px;
        margin-right:52px;
    }

    .page{
        padding:25px 14px 50px;
    }

    .card{
        padding:27px 18px;
    }

    .title{
        font-size:31px;
    }

    .subtitle{
        font-size:20px;
    }

    .field-label{
        font-size:21px;
    }

    .team-input{
        height:60px;
        font-size:22px;
    }

    .done-button{
        height:60px;
        font-size:23px;
    }
}

</style>

</head>

<body>

<header class="top-header">

    <button
        class="back-button"
        id="backButton"
        type="button"
    >
        ‹
    </button>

    <div class="page-title">
        Tournament Setup
    </div>

</header>


<main class="page">

    <section class="card">

        <div class="title">
            Number of Teams
        </div>

        <div class="subtitle">
            How many teams are participating?
        </div>

        <label
            class="field-label"
            for="teamCount"
        >
            Total number of teams
        </label>

        <input
            class="team-input"
            id="teamCount"
            type="number"
            min="2"
            max="100"
            inputmode="numeric"
            placeholder="Enter number of teams"
        >

        <button
            class="done-button"
            id="doneButton"
            type="button"
        >
            DONE
        </button>

    </section>

</main>


<script>

const backButton =
    document.getElementById("backButton");

const doneButton =
    document.getElementById("doneButton");

const teamCount =
    document.getElementById("teamCount");


/* BACK */

backButton.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


/* DONE */

doneButton.addEventListener(
    "click",
    function(){

        const count =
            Number(teamCount.value);

        if(!count){

            alert(
                "Please enter total number of teams."
            );

            return;
        }

        if(count < 2){

            alert(
                "Minimum 2 teams are required."
            );

            return;
        }


        /*
         SAVE TEAM COUNT
        */

        sessionStorage.setItem(
            "crickpulseTeamCount",
            count
        );


        /*
         NEXT SCREEN
        */

        window.location.href =
            "invite-captains.html";

    }
);

</script>

</body>

</html>
