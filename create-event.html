<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="CRICKPULSE - Create Tournament or Series"
>

<title>CRICKPULSE | Create Event</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana,Geneva,sans-serif;
    background:#f7f5ff;
    color:#171225;
    min-height:100vh;
}

/* HEADER */

.top-header{
    height:82px;
    background:#fff;
    border-bottom:1px solid #e4ddf2;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    position:sticky;
    top:0;
    z-index:100;
}

.back-button{
    width:58px;
    height:58px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;
    color:#6328c7;

    font-size:42px;
    font-weight:900;

    cursor:pointer;
}

.page-header-title{
    flex:1;
    text-align:center;

    font-size:27px;
    font-weight:900;

    margin-left:10px;
}

.header-space{
    width:58px;
}

/* PAGE */

.page{
    width:100%;
    max-width:760px;

    margin:auto;

    padding:30px 16px 60px;
}

/* EVENT TYPE */

.event-type{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;

    margin-bottom:24px;
}

.event-type-button{
    height:58px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;
    color:#5f4a7f;

    font-family:Verdana,Geneva,sans-serif;

    font-size:22px;
    font-weight:900;

    cursor:pointer;
}

.event-type-button.active{
    background:#6c35d9;
    border-color:#ff3b30;
    color:#fff;
}

/* BANNER */

.banner-box{
    width:100%;
    height:220px;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    cursor:pointer;

    margin-bottom:24px;
}

.banner-placeholder{
    color:#a9a0b5;
    font-size:24px;
    font-weight:700;
}

.banner-preview{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;

    position:absolute;
    inset:0;
}

/* LOGO */

.logo-area{
    margin-bottom:28px;
}

.logo-box{
    width:125px;
    height:125px;

    border:1.5px solid #ff3b30;
    border-radius:50%;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    cursor:pointer;
}

.logo-placeholder{
    color:#aaa1b5;
    font-size:18px;
    font-weight:700;
    text-align:center;
    padding:10px;
}

.logo-preview{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;

    position:absolute;
    inset:0;
}

input[type="file"]{
    display:none;
}

/* FIELD */

.field{
    margin-bottom:25px;
}

.field-label{
    display:block;

    font-size:24px;
    font-weight:900;

    margin-bottom:9px;
}

.line-input{
    width:100%;
    height:58px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;

    outline:none;

    color:#171225;

    font-family:Verdana,Geneva,sans-serif;

    font-size:22px;
    font-weight:700;

    padding:5px 14px;
}

.line-input::placeholder{
    color:#aaa2ae;
    font-weight:500;
}

/* ORGANIZER */

.organizer-section{
    margin-top:10px;
    margin-bottom:32px;

    background:#fff;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:22px;

    box-shadow:0 5px 18px rgba(76,45,130,.06);
}

.organizer-title{
    font-size:25px;
    font-weight:900;

    margin-bottom:20px;
}

.organizer-field{
    margin-bottom:19px;
}

.organizer-field:last-child{
    margin-bottom:0;
}

.organizer-label{
    display:block;

    color:#81768e;

    font-size:17px;
    font-weight:700;

    margin-bottom:6px;
}

.organizer-value{
    min-height:44px;

    border-bottom:1.5px solid #ff3b30;

    display:flex;
    align-items:center;

    color:#2d2538;

    font-size:21px;
    font-weight:800;
}

/* DETAILS */

.details-title{
    font-size:26px;
    font-weight:900;

    margin-bottom:18px;
}

/* DATE */

.date-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;

    margin-bottom:30px;
}

.date-field label{
    display:block;

    font-size:20px;
    font-weight:900;

    margin-bottom:8px;
}

.date-input{
    width:100%;
    height:56px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;

    padding:0 10px;

    color:#171225;

    font-family:Verdana,Geneva,sans-serif;

    font-size:18px;
    font-weight:700;
}

/* CHOICES */

.choice-section{
    margin-bottom:30px;
}

.choice-title{
    font-size:23px;
    font-weight:900;

    margin-bottom:13px;
}

.choice-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.choice-button{
    min-height:52px;

    padding:8px 17px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;
    color:#3d334b;

    font-family:Verdana,Geneva,sans-serif;

    font-size:18px;
    font-weight:800;

    cursor:pointer;
}

.choice-button.active{
    background:#6c35d9;
    border-color:#ff3b30;
    color:#fff;
}

/* CREATE */

.create-button{
    width:100%;
    height:64px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#6c35d9;
    color:#fff;

    font-family:Verdana,Geneva,sans-serif;

    font-size:23px;
    font-weight:900;

    cursor:pointer;

    margin-top:8px;
}

.create-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* MOBILE */

@media(max-width:480px){

    .top-header{
        height:76px;
        padding:0 11px;
    }

    .back-button{
        width:52px;
        height:52px;
        font-size:38px;
    }

    .page-header-title{
        font-size:22px;
    }

    .header-space{
        width:52px;
    }

    .page{
        padding:25px 14px 50px;
    }

    .event-type-button{
        height:55px;
        font-size:20px;
    }

    .banner-box{
        height:185px;
    }

    .banner-placeholder{
        font-size:21px;
    }

    .logo-box{
        width:110px;
        height:110px;
    }

    .field-label{
        font-size:21px;
    }

    .line-input{
        height:55px;
        font-size:20px;
    }

    .organizer-title{
        font-size:23px;
    }

    .organizer-value{
        font-size:18px;
    }

    .details-title{
        font-size:23px;
    }

    .choice-title{
        font-size:21px;
    }

    .choice-button{
        font-size:17px;
    }

    .create-button{
        height:60px;
        font-size:21px;
    }
}

</style>

</head>

<body>

<header class="top-header">

<button
    class="back-button"
    id="backButton"
    type="button"
>
‹
</button>

<div class="page-header-title">
Create Tournament / Series
</div>

<div class="header-space"></div>

</header>


<main class="page">


<div class="event-type">

<button
    class="event-type-button active"
    id="tournamentButton"
    type="button"
>
Tournament
</button>

<button
    class="event-type-button"
    id="seriesButton"
    type="button"
>
Series
</button>

</div>


<label
    class="banner-box"
    for="bannerInput"
>

<span
    class="banner-placeholder"
    id="bannerPlaceholder"
>
Add Banner
</span>

<img
    class="banner-preview"
    id="bannerPreview"
    src=""
    alt="Banner Preview"
>

<input
    type="file"
    id="bannerInput"
    accept="image/*"
>


<div class="logo-area">

<label
    class="logo-box"
    for="logoInput"
>

<span
    class="logo-placeholder"
    id="logoPlaceholder"
>
Add Logo
</span>

<img
    class="logo-preview"
    id="logoPreview"
    src=""
    alt="Logo Preview"
>

</label>

<input
    type="file"
    id="logoInput"
    accept="image/*"
>

</div>


<div class="field">

<label
    class="field-label"
    id="eventNameLabel"
    for="eventName"
>
Tournament Name
</label>

<input
    class="line-input"
    id="eventName"
    type="text"
    placeholder="Tournament Name"
    autocomplete="off"
>

</div>


<div class="field">

<label
    class="field-label"
    for="city"
>
City
</label>

<input
    class="line-input"

    type="text"
    placeholder="Enter City"
>

</div>


<div class="field">

<label
    class="field-label"
    for="ground"
>
Ground
</label>

<input
    class="line-input"
    id="ground"
    type="text"
    placeholder="Enter Ground"
>

</div>


<section class="organizer-section">

<div class="organizer-title">
Organizer
</div>

<div class="organizer-field">

<span class="organizer-label">
Organizer Name
</span>

<div
    class="organizer-value"
    id="organizerName"
>
Loading...
</div>

</div>


<div class="organizer-field">

<span class="organizer-label">
Organizer Number
</span>

<div
    class="organizer-value"
    id="organizerNumber"
>
Loading...
</div>

</div>


<div class="organizer-field">

<span class="organizer-label">
Organizer Email
</span>

<div

Loading...
</div>

</div>

</section>


<div class="details-title">

</div>


<div class="date-row">

<div class="date-field">

<label for="startDate">
Start Date
</label>

<input
    class="date-input"
    id="startDate"
    type="date"
>

</div>


<div class="date-field">

<label for="endDate">
End Date
</label>

<input
    class="date-input"
    id="endDate"
    type="date"
>

</div>

</div>


<section class="choice-section">

<div class="choice-title">
Tournament Category
</div>

<div

    id="categoryGrid"
>

<button class="choice-button" data-value="Open" type="button">
Open
</button>

<button class="choice-button" data-value="Corporate" type="button">
Corporate
</button>

<button class="choice-button" data-value="School" type="button">
School
</button>

<button class="choice-button" data-value="College" type="button">
College
</button>

<button class="choice-button" data-value="University" type="button">
University
</button>

<button class="choice-button" data-value="Club" type="button">
Club
</button>

</div>

</section>


<section class="choice-section">

<div class="choice-title">
Select Ball Type
</div>

<div
    class="choice-grid"
    id="ballGrid"
>

<button class="choice-button" data-value="Tennis" type="button">
Tennis
</button>

<button class="choice-button" data-value="Leather" type="button">
Leather
</button>

<button class="choice-button" data-value="Other" type="button">
Other
</button>

</div>

</section>


<section class="choice-section">

<div class="choice-title">
Pitch Type
</div>

<div
    class="choice-grid"
    id="pitchGrid"
>

<button class="choice-button" data-value="Rough" type="button">
Rough
</button>
