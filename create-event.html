<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | Create Tournament</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Verdana,Geneva,sans-serif;

    background:
        linear-gradient(
            180deg,
            #f2ecff 0%,
            #faf9ff 45%,
            #ffffff 100%
        );

    color:#171225;
    min-height:100vh;
}

.header{

    height:78px;

    background:#ffffff;

    border-bottom:1px solid #ded4f2;

    display:flex;
    align-items:center;

    padding:0 12px;

    position:sticky;
    top:0;

    z-index:1000;
}

.back-btn{

    width:52px;
    height:52px;

    border:1.5px solid #ff3b30;

    border-radius:10px;

    background:#ffffff;

    color:#6c35d9;

    font-size:38px;

    font-weight:900;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.header-title{

    flex:1;

    text-align:center;

    font-size:24px;

    font-weight:900;

    color:#35146d;

    margin-right:52px;
}

.page{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:25px 14px 60px;
}

.card{

    background:#ffffff;

    border:1.5px solid #ff3b30;

    border-radius:16px;

    padding:22px 18px;

    box-shadow:
        0 8px 25px
        rgba(72,45,120,.08);
}

.title{

    color:#35146d;

    font-size:25px;

    font-weight:900;

    margin-bottom:8px;
}

.subtitle{

    color:#777080;

    font-size:14px;

    line-height:1.5;

    margin-bottom:24px;
}

.field{

    margin-bottom:18px;
}

.field label{

    display:block;

    margin-bottom:8px;

    color:#2b1943;

    font-size:16px;

    font-weight:900;
}

.field input,
.field select{

    width:100%;

    height:54px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#ffffff;

    padding:0 13px;

    font-family:Verdana,Geneva,sans-serif;

    font-size:17px;

    font-weight:700;

    color:#241536;

    outline:none;
}

.field input:focus,
.field select:focus{

    border-color:#6c35d9;

    box-shadow:
        0 0 0 3px
        rgba(108,53,217,.13);
}

.save-btn{

    width:100%;

    height:57px;

    margin-top:5px;

    border:1.5px solid #ff3b30;

    border-radius:9px;

    background:#6c35d9;

    color:#ffffff;

    font-size:18px;

    font-weight:900;

    cursor:pointer;
}

.save-btn:disabled{

    opacity:.6;

}

.login-message{

    margin-bottom:18px;

    padding:13px;

    border-radius:9px;

    background:#f5f0ff;

    border:1px solid #d9caf7;

    color:#6c35d9;

    font-size:14px;

    font-weight:800;

    text-align:center;
}

.error-message{

    display:none;

    margin-bottom:15px;

    padding:13px;

    border-radius:9px;

    background:#fff1f1;

    border:1.5px solid #ff3b30;

    color:#c62828;

    font-size:14px;

    line-height:1.5;

    font-weight:700;
}

@media(max-width:480px){

    .header{
        height:74px;
    }

    .back-btn{
        width:50px;
        height:50px;
        font-size:35px;
    }

    .header-title{
        font-size:22px;
        margin-right:50px;
    }

    .page{
        padding:20px 12px 45px;
    }

    .card{
        padding:19px 15px;
    }

    .title{
        font-size:22px;
    }

}

</style>

</head>


<body>


<header class="header">

<button
    class="back-btn"
    id="backButton"
    type="button"
>
    ‹
</button>

<div class="header-title">
    Create Tournament
</div>

</header>


<main class="page">

<section class="card">

<div class="title">
    Create Tournament / Series
</div>

<div class="subtitle">
    Create your tournament. You will become its Organizer and will have control over tournament management.
</div>


<div
    class="login-message"
    id="loginMessage"
>
    Checking login...
</div>


<div
    class="error-message"
    id="errorMessage"
>
</div>


<div class="field">

<label for="eventName">
    Tournament / Series Name
</label>

<input
    id="eventName"
    type="text"
    autocomplete="off"
    placeholder="Enter tournament name"
>

</div>


<div class="field">

<label for="eventType">
    Type
</label>

<select id="eventType">

<option value="">
    Select Type
</option>

<option value="Tournament">
    Tournament
</option>

<option value="Series">
    Series
</option>

</select>

</div>


<div class="field">

<label for="date">
    Date
</label>

<input
    id="date"
    type="date"
>

</div>


<div class="field">

<label for="ground">
    Ground / Venue
</label>

<input
    id="ground"
    type="text"
    autocomplete="off"
    placeholder="Enter ground / venue"
>

</div>


<div class="field">

<label for="ballType">
    Ball Type
</label>

<select id="ballType">

<option value="">
    Select Ball Type
</option>

<option value="Leather">
    Leather
</option>

<option value="Tennis">
    Tennis
</option>

<option value="Season Ball">
    Season Ball
</option>

<option value="Other">
    Other
</option>

</select>

</div>


<div class="field">

<label for="category">
    Category
</label>

<select id="category">

<option value="">
    Select Category
</option>

<option value="Open">
    Open
</option>

<option value="Corporate">
    Corporate
</option>

<option value="School">
    School
</option>

<option value="College">
    College
</option>

<option value="Teachers">
    Teachers
</option>

<option value="Other">
    Other
</option>

</select>

</div>


<button
    class="save-btn"
    id="saveButton"
    type="button"
>
    SAVE TOURNAMENT
</button>


</section>

</main>


<script type="module">

import {
    db,
    auth
}
from "./firebase.js";

import {
    doc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* =========================================
   ELEMENTS
========================================= */

const eventNameInput =
    document.getElementById(
        "eventName"
    );

const eventTypeInput =
    document.getElementById(
        "eventType"
    );

const dateInput =
    document.getElementById(
        "date"
    );

const groundInput =
    document.getElementById(
        "ground"
    );

const ballTypeInput =
    document.getElementById(
        "ballType"
    );

const categoryInput =
    document.getElementById(
        "category"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;


/* =========================================
   SHOW ERROR
========================================= */

function showError(message){

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

}


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(
    auth,
    function(user){

        currentUser =
            user || null;


        if(!currentUser){

            loginMessage.textContent =
                "Please login before creating a tournament.";

            loginMessage.style.color =
                "#c62828";

            saveButton.disabled =
                true;

            return;

        }


        loginMessage.textContent =
            "Logged in. You will be the Organizer of this tournament.";

        loginMessage.style.color =
            "#6c35d9";

        saveButton.disabled =
            false;


        console.log(
            "CRICKPULSE ORGANIZER UID:",
            currentUser.uid
        );

    }
);


/* =========================================
   SAVE TOURNAMENT
========================================= */

saveButton.addEventListener(
    "click",
    async function(){

        errorMessage.style.display =
            "none";


        /* =========================
           AUTHORIZATION CHECK
        ========================= */

        if(!currentUser){

            showError(
                "Please login first. Only a logged-in user can create a tournament."
            );

            return;

        }


        const name =
            eventNameInput.value.trim();

        const eventType =
            eventTypeInput.value;

        const date =
            dateInput.value;

        const ground =
            groundInput.value.trim();

        const ballType =
            ballTypeInput.value;

        const category =
            categoryInput.value;


        /* =========================
           VALIDATION
        ========================= */

        if(!name){

            showError(
                "Tournament / Series name is required."
            );

            eventNameInput.focus();

            return;

        }


        if(!eventType){

            showError(
                "Please select Tournament or Series."
            );

            eventTypeInput.focus();

            return;

        }


        if(!date){

            showError(
                "Please select the date."
            );

            dateInput.focus();

            return;

        }


        if(!ground){

            showError(
                "Ground / Venue is required."
            );

            groundInput.focus();

            return;

        }


        if(!ballType){

            showError(
                "Please select Ball Type."
            );

            ballTypeInput.focus();

            return;

        }


        if(!category){

            showError(
                "Please select Category."
            );

            categoryInput.focus();

            return;

        }


        /* =========================
           DISABLE BUTTON
        ========================= */

        saveButton.disabled =
            true;

        saveButton.textContent =
            "CREATING...";


        try{

            /*
             * Create a new Firestore
             * document with a new ID.
             */

            const eventRef =
                doc(
                    db,
                    "events",
                    crypto.randomUUID()
                );


            const eventId =
                eventRef.id;


            /* =========================
               IMPORTANT SECURITY FIELD
            ========================= */

            await setDoc(
                eventRef,
                {

                    eventName:
                        name,

                    eventType:
                        eventType,

                    date:
                        date,

                    ground:
                        ground,

                    ballType:
                        ballType,

                    category:
                        category,


                    /*
                     * THIS USER IS THE
                     * ORGANIZER.
                     */

                    organizerUid:
                        currentUser.uid,


                    /*
                     * Initial team list.
                     */

                    teams:
                        [],


                    /*
                     * Useful metadata.
                     */

                    createdAt:
                        serverTimestamp(),

                    createdBy:
                        currentUser.uid,

                    status:
                        "active"

                }
            );


            /* =========================
               SAVE CURRENT EVENT
            ========================= */

            sessionStorage.setItem(
                "crickpulseEventId",
                eventId
            );


            /*
             * Save organizer UID locally
             * only for UI convenience.
             *
             * Firestore remains the
             * actual source of authority.
             */

            sessionStorage.setItem(
                "crickpulseOrganizerUid",
                currentUser.uid
            );


            /* =========================
               NEXT SCREEN
            ========================= */

            window.location.href =
                "add-teams.html?eventId=" +
                encodeURIComponent(
                    eventId
                );

        }
        catch(error){

            console.error(
                "CREATE EVENT ERROR:",
                error
            );


            showError(
                "Tournament create नहीं हो पाया.\n\n" +
                error.message
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "SAVE TOURNAMENT";

        }

    }
);


/* =========================================
   BACK
========================================= */

document
.getElementById(
    "backButton"
)
.addEventListener(
    "click",
    function(){

        window.location.href =
            "dashboard.html";

    }
);

</script>

</body>

</html>
