<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | Add New Teams</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#111111;
    min-height:100vh;
}

/* HEADER */

.header{
    height:70px;
    background:#ffffff;
    border-bottom:1px solid #e00000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:1px;
    color:#111111;
}

.logo span{
    color:#e00000;
}

.back-btn{
    border:1px solid #e00000;
    background:#ffffff;
    color:#e00000;

    border-radius:10px;

    padding:10px 16px;

    font-size:17px;
    font-weight:700;

    cursor:pointer;
}

/* MAIN */

.container{
    width:100%;
    max-width:600px;

    margin:auto;

    padding:24px 18px 40px;
}

.title{
    text-align:center;

    font-size:28px;
    font-weight:800;

    margin-bottom:8px;
}

.subtitle{
    text-align:center;

    font-size:17px;

    color:#666666;

    margin-bottom:25px;
}

/* EVENT */

.event-info{
    border:1px solid #e00000;

    border-radius:12px;

    padding:12px 14px;

    margin-bottom:20px;

    background:#ffffff;
}

.event-info-title{
    font-size:15px;
    color:#777777;

    margin-bottom:4px;
}

.event-info-id{
    font-size:14px;
    font-weight:700;

    word-break:break-all;
}

/* SAVED TEAM */

.saved-team{
    border:1px solid #e00000;

    border-radius:14px;

    padding:13px;

    display:flex;
    align-items:center;

    gap:14px;

    margin-bottom:16px;

    background:#ffffff;
}

.saved-logo{
    width:62px;
    height:62px;

    min-width:62px;

    border-radius:50%;

    border:1px solid #e00000;

    object-fit:cover;

    background:#f5f5f5;
}

.no-logo{
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;

    color:#888888;

    text-align:center;
}

.saved-info{
    flex:1;
    min-width:0;
}

.saved-info h3{
    font-size:21px;

    margin-bottom:5px;

    word-break:break-word;
}

.saved-info p{
    font-size:16px;

    color:#666666;

    margin-top:3px;

    word-break:break-word;
}

.remove-btn{
    border:1px solid #e00000;

    background:#ffffff;

    color:#e00000;

    border-radius:8px;

    padding:8px 10px;

    font-size:14px;

    cursor:pointer;
}

/* FORM */

.team-card{
    border:1px solid #e00000;

    border-radius:16px;

    padding:20px 17px;

    background:#ffffff;
}

.logo-section{
    text-align:center;

    margin-bottom:23px;
}

.logo-circle{
    width:125px;
    height:125px;

    border-radius:50%;

    border:2px solid #e00000;

    margin:0 auto 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#fafafa;

    cursor:pointer;
}

.logo-circle img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.logo-placeholder{
    color:#888888;

    text-align:center;

    font-size:16px;

    padding:10px;
}

.logo-label{
    color:#e00000;

    font-size:16px;

    font-weight:700;
}

/* INPUTS */

.field{
    margin-bottom:19px;
}

.field label{
    display:block;

    font-size:18px;

    font-weight:700;

    margin-bottom:8px;
}

.field input{
    width:100%;

    height:53px;

    border:1px solid #e00000;

    border-radius:10px;

    padding:0 14px;

    font-size:18px;

    outline:none;

    background:#ffffff;
}

.mobile-wrap{
    display:flex;
    gap:8px;
}

.country-code{
    width:72px !important;

    text-align:center;

    background:#f7f7f7 !important;

    font-weight:700;
}

.mobile-input{
    flex:1;
}

/* BUTTONS */

.add-team-btn{
    width:100%;

    height:57px;

    margin-top:8px;

    border:1px solid #e00000;

    border-radius:11px;

    background:#ffffff;

    color:#e00000;

    font-size:19px;

    font-weight:800;

    cursor:pointer;
}

.done-btn{
    width:100%;

    height:58px;

    margin-top:20px;

    border:none;

    border-radius:11px;

    background:#e00000;

    color:#ffffff;

    font-size:20px;

    font-weight:800;

    cursor:pointer;
}

.done-btn:disabled{
    opacity:.6;
}

.empty-message{
    text-align:center;

    color:#777777;

    font-size:16px;

    margin-bottom:18px;
}

@media(max-width:420px){

    .container{
        padding:20px 14px 35px;
    }

    .title{
        font-size:25px;
    }

    .team-card{
        padding:18px 14px;
    }

    .field input{
        font-size:17px;
    }

}

</style>

</head>


<body>


<header class="header">

<div class="logo">
CRICK<span>PULSE</span>
</div>

<button
    class="back-btn"
    id="backButton"
    type="button"
>
← Back
</button>

</header>


<main class="container">


<h1 class="title">
Add New Teams
</h1>


<p class="subtitle">
Add all the teams participating in this tournament
</p>


<div class="event-info">

<div class="event-info-title">
Tournament
</div>

<div
    id="eventIdDisplay"
    class="event-info-id"
>
Loading...
</div>

</div>


<div id="savedTeams"></div>


<div class="team-card">


<div class="logo-section">

<label for="logoInput">

<div class="logo-circle">

<img
    id="logoPreview"
    alt="Team Logo"
>

<div
    id="logoPlaceholder"
    class="logo-placeholder"
>
Team Logo
</div>

</div>

</label>


<input
    type="file"
    id="logoInput"
    accept="image/*"
    hidden
>


<div class="logo-label">
Add Team Logo
</div>

</div>


<div class="field">

<label>
Team Name
</label>

<input
    type="text"
    id="teamName"
    placeholder="Enter team name"
>

</div>


<div class="field">

<label>
City
</label>

<input
    type="text"
    id="city"
    placeholder="Enter city"
>

</div>


<div class="field">

<label>
Captain Mobile Number
</label>

<div class="mobile-wrap">

<input
    type="text"
    value="+91"
    class="country-code"
    readonly
>

<input
    type="tel"
    id="captainMobile"
    class="mobile-input"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter mobile number"
>

</div>

</div>


<div class="field">

<label>
Captain Name
</label>

<input
    type="text"
    id="captainName"
    placeholder="Enter captain name"
>

</div>


<button
    class="add-team-btn"
    id="addTeamButton"
    type="button"
>
＋ Add New Team
</button>


</div>


<button
    class="done-btn"
    id="doneButton"
    type="button"
>
Done
</button>


</main>


<script type="module">

import {
    db
} from "./firebase.js";

import {
    doc,
    getDoc,
    updateDoc,
    arrayUnion
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================
   VARIABLES
========================================= */

let newTeams = [];

let existingTeams = [];

let selectedLogo = "";

let eventId = "";


/* =========================================
   GET EVENT ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

eventId =
    params.get("eventId") ||
    sessionStorage.getItem(
        "crickpulseEventId"
    );


if(!eventId){

    alert(
        "Tournament ID is missing."
    );

    window.location.href =
        "create-event.html";

}


document
.getElementById("eventIdDisplay")
.textContent =
    eventId;


/* =========================================
   FIRESTORE
========================================= */

const eventRef =
    doc(
        db,
        "events",
        eventId
    );


/* =========================================
   LOAD EXISTING TEAMS
========================================= */

async function loadTeams(){

    try{

        const snapshot =
            await getDoc(
                eventRef
            );


        if(!snapshot.exists()){

            alert(
                "Tournament not found."
            );

            return;

        }


        const data =
            snapshot.data();


        existingTeams =
            Array.isArray(data.teams)
            ? data.teams
            : [];


        renderTeams();

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Tournament data load नहीं हो पाया."
        );

    }

}


/* =========================================
   LOGO PREVIEW
========================================= */

document
.getElementById("logoInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }


        /*
         * IMPORTANT:
         *
         * Logo को Firestore में
         * Base64 के रूप में SAVE नहीं करेंगे.
         *
         * अभी सिर्फ browser preview रहेगा.
         */

        const reader =
            new FileReader();


        reader.onload =
            function(e){

                selectedLogo =
                    e.target.result;


                const preview =
                    document.getElementById(
                        "logoPreview"
                    );


                preview.src =
                    selectedLogo;

                preview.style.display =
                    "block";


                document
                .getElementById(
                    "logoPlaceholder"
                )
                .style.display =
                    "none";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   ADD TEAM
========================================= */

document
.getElementById("addTeamButton")
.addEventListener(
    "click",
    function(){

        const teamName =
            document
            .getElementById("teamName")
            .value
            .trim();


        const city =
            document
            .getElementById("city")
            .value
            .trim();


        const mobile =
            document
            .getElementById("captainMobile")
            .value
            .trim();


        const captainName =
            document
            .getElementById("captainName")
            .value
            .trim();


        if(!teamName){

            alert(
                "Please enter Team Name."
            );

            return;

        }


        if(!city){

            alert(
                "Please enter City."
            );

            return;

        }


        if(mobile.length !== 10){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        if(!captainName){

            alert(
                "Please enter Captain Name."
            );

            return;

        }


        const duplicate =
            [
                ...existingTeams,
                ...newTeams
            ]
            .some(
                function(team){

                    return (
                        team.teamName &&
                        team.teamName
                        .toLowerCase()
                        ===
                        teamName
                        .toLowerCase()
                    );

                }
            );


        if(duplicate){

            alert(
                "This team is already added."
            );

            return;

        }


        /*
         * IMPORTANT:
         *
         * Firestore में केवल SAFE TEXT VALUES
         * save करेंगे.
         *
         * Logo अभी save नहीं होगा.
         * इसलिए invalid nested entry वाली
         * समस्या नहीं आएगी.
         */

        const team = {

            teamId:
                "TEAM_" +
                Date.now(),

            teamName:
                teamName,

            city:
                city,

            captainMobile:
                "+91" +
                mobile,

            captainName:
                captainName,

            createdAt:
                new Date().toISOString()

        };


        newTeams.push(
            team
        );


        renderTeams();

        clearForm();

    }
);


/* =========================================
   RENDER
========================================= */

function renderTeams(){

    const container =
        document.getElementById(
            "savedTeams"
        );


    container.innerHTML =
        "";


    const allTeams =
        [
            ...existingTeams,
            ...newTeams
        ];


    if(allTeams.length === 0){

        container.innerHTML =
            `
            <div class="empty-message">
                No teams added yet.
            </div>
            `;

        return;

    }


    allTeams.forEach(
        function(team){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "saved-team";


            const removable =
                newTeams.some(
                    function(item){

                        return (
                            item.teamId
                            ===
                            team.teamId
                        );

                    }
                );


            card.innerHTML =

                `
                <div class="saved-logo no-logo">
                    TEAM
                </div>

                <div class="saved-info">

                    <h3>
                        ${escapeHTML(
                            team.teamName
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            team.city
                        )}
                    </p>

                    <p>
                        Captain:
                        ${escapeHTML(
                            team.captainName
                        )}
                    </p>

                </div>

                ${
                    removable
                    ?
                    `
                    <button
                        class="remove-btn"
                        type="button"
                    >
                        Remove
                    </button>
                    `
                    :
                    ""
                }
                `;


            if(removable){

                card
                .querySelector(
                    ".remove-btn"
                )
                .addEventListener(
                    "click",
                    function(){

                        newTeams =
                            newTeams.filter(
                                function(item){

                                    return (
                                        item.teamId
                                        !==
                                        team.teamId
                                    );

                                }
                            );

                        renderTeams();

                    }
                );

            }


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

    document
    .getElementById("teamName")
    .value =
        "";

    document
    .getElementById("city")
    .value =
        "";

    document
    .getElementById("captainMobile")
    .value =
        "";

    document
    .getElementById("captainName")
    .value =
        "";


    selectedLogo =
        "";


    document
    .getElementById("logoInput")
    .value =
        "";


    document
    .getElementById("logoPreview")
    .src =
        "";


    document
    .getElementById("logoPreview")
    .style.display =
        "none";


    document
    .getElementById("logoPlaceholder")
    .style.display =
        "block";

}


/* =========================================
   DONE / SAVE
========================================= */

document
.getElementById("doneButton")
.addEventListener(
    "click",
    async function(){

        if(newTeams.length === 0){

            alert(
                "Please add at least one new team."
            );

            return;

        }


        const button =
            document.getElementById(
                "doneButton"
            );


        button.disabled =
            true;

        button.textContent =
            "Saving...";


        try{

            /*
             * प्रत्येक team को
             * Firestore में सुरक्षित तरीके से
             * arrayUnion किया जाएगा.
             */

            for(
                const team
                of newTeams
            ){

                await updateDoc(
                    eventRef,
                    {

                        teams:
                            arrayUnion(
                                team
                            )

                    }
                );

            }


            alert(
                newTeams.length +
                " team(s) saved successfully."
            );


            existingTeams =
                [
                    ...existingTeams,
                    ...newTeams
                ];


            newTeams = [];


            renderTeams();

        }
        catch(error){

            console.error(
                "TEAM SAVE ERROR:",
                error
            );


            alert(
                "Team save नहीं हो पाई.\n\n" +
                error.message
            );

        }
        finally{

            button.disabled =
                false;

            button.textContent =
                "Done";

        }

    }
);


/* =========================================
   BACK
========================================= */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   START
========================================= */

loadTeams();

</script>

</body>

</html>
