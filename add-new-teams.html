<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CRICKPULSE | Add New Teams</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Verdana,Geneva,sans-serif;
    background:#f7f5ff;
    color:#171225;
    min-height:100vh;
}

.header{
    height:76px;
    background:#fff;
    border-bottom:1px solid #e4ddf2;

    display:flex;
    align-items:center;

    padding:0 15px;
}

.back-btn{
    width:52px;
    height:52px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;
    color:#6328c7;

    font-size:36px;
    font-weight:900;

    cursor:pointer;
}

.header-title{
    flex:1;
    text-align:center;

    font-size:25px;
    font-weight:900;

    margin-right:52px;
}

.container{
    width:100%;
    max-width:700px;

    margin:auto;

    padding:28px 16px 50px;
}

.main-card{
    background:#fff;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:26px 20px;

    box-shadow:
        0 6px 20px rgba(0,0,0,.06);
}

.title{
    font-size:32px;
    font-weight:900;

    margin-bottom:10px;
}

.subtitle{
    font-size:19px;
    color:#6d667c;

    line-height:1.5;

    margin-bottom:22px;
}

.security-box{
    border:1.5px solid #6c35d9;
    border-radius:8px;

    padding:13px;

    margin-bottom:16px;

    background:#f7f2ff;

    color:#5424a8;

    font-size:14px;

    line-height:1.5;

    font-weight:800;
}

.event-box{
    border:1.5px solid #ff3b30;
    border-radius:8px;

    padding:13px;

    margin-bottom:14px;
}

.event-label{
    font-size:15px;
    color:#6d667c;

    margin-bottom:5px;
}

.event-id{
    font-size:14px;
    font-weight:800;

    word-break:break-all;
}

.team-limit{
    border:1.5px solid #ff3b30;
    border-radius:8px;

    padding:13px;

    margin-bottom:22px;

    background:#fff;
}

.team-limit-label{
    font-size:15px;
    color:#6d667c;

    margin-bottom:5px;
}

.team-limit-value{
    font-size:20px;
    font-weight:900;

    color:#6c35d9;
}

.saved-team{
    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:14px;

    margin-bottom:14px;

    display:flex;
    align-items:center;

    gap:12px;

    background:#fff;
}

.saved-logo{
    width:60px;
    height:60px;

    min-width:60px;

    border-radius:50%;

    border:1.5px solid #ff3b30;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f7f5ff;

    color:#6c35d9;

    font-size:12px;
    font-weight:900;

    overflow:hidden;
}

.saved-logo img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.saved-info{
    flex:1;
    min-width:0;
}

.saved-info h3{
    font-size:20px;
    font-weight:900;

    margin-bottom:5px;

    word-break:break-word;
}

.saved-info p{
    font-size:15px;
    color:#6d667c;

    margin-top:3px;
}

.form-card{
    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:20px 16px;

    margin-top:22px;
}

.logo-section{
    text-align:center;
    margin-bottom:22px;
}

.logo-circle{
    width:120px;
    height:120px;

    margin:0 auto 10px;

    border:2px solid #ff3b30;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#fafafa;

    cursor:pointer;
}

.logo-circle img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.logo-placeholder{
    font-size:16px;
    color:#777;
}

.logo-label{
    color:#6c35d9;

    font-size:16px;
    font-weight:900;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;

    font-size:19px;
    font-weight:900;

    margin-bottom:8px;
}

.field input{
    width:100%;
    height:58px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    padding:0 14px;

    background:#fff;

    font-family:Verdana,Geneva,sans-serif;

    font-size:19px;

    outline:none;
}

.mobile-wrap{
    display:flex;
    gap:8px;
}

.country-code{
    width:70px !important;

    text-align:center;

    background:#f5f5f5 !important;

    font-weight:900;
}

.mobile-input{
    flex:1;
}

.add-btn,
.done-btn{
    width:100%;
    height:60px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    font-family:Verdana,Geneva,sans-serif;

    font-size:20px;
    font-weight:900;

    cursor:pointer;
}

.add-btn{
    background:#fff;
    color:#6c35d9;

    margin-top:5px;
}

.done-btn{
    background:#6c35d9;
    color:#fff;

    margin-top:22px;
}

.done-btn:disabled,
.add-btn:disabled{
    opacity:.6;
}

.status{
    margin-top:10px;

    text-align:center;

    font-size:16px;

    font-weight:800;
}

.empty{
    text-align:center;

    color:#777;

    font-size:16px;

    padding:15px;
}

.access-denied{
    display:none;

    margin-top:20px;

    padding:18px;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    background:#fff1f1;

    color:#c62828;

    font-size:17px;

    line-height:1.5;

    font-weight:900;

    text-align:center;
}

@media(max-width:480px){

    .header{
        height:74px;
        padding:0 11px;
    }

    .back-btn{
        width:50px;
        height:50px;
        font-size:34px;
    }

    .header-title{
        font-size:22px;
        margin-right:50px;
    }

    .container{
        padding:24px 14px 45px;
    }

    .main-card{
        padding:24px 16px;
    }

    .title{
        font-size:29px;
    }

    .subtitle{
        font-size:18px;
    }

    .field input{
        font-size:18px;
    }

}

</style>

</head>


<body>


<header class="header">

<button
    class="back-btn"
    id="backButton"
    type="button"
>
‹
</button>

<div class="header-title">
    Add New Teams
</div>

</header>


<main class="container">

<section class="main-card">


<div class="title">
    Add New Teams
</div>


<div class="subtitle">
    Add teams participating in this tournament.
</div>


<div
    class="security-box"
    id="securityBox"
>
    Checking Organizer permission...
</div>


<div class="event-box">

<div class="event-label">
    Tournament ID
</div>

<div
    class="event-id"
    id="eventIdDisplay"
>
    Loading...
</div>

</div>


<div class="team-limit">

<div class="team-limit-label">
    Teams
</div>

<div
    class="team-limit-value"
    id="teamLimitDisplay"
>
    Loading...
</div>

</div>


<div id="savedTeams">

<div class="empty">
    No teams added yet.
</div>

</div>


<div
    class="form-card"
    id="formCard"
    style="display:none;"
>


<div class="logo-section">

<label for="logoInput">

<div class="logo-circle">

<img
    id="logoPreview"
    alt="Team Logo"
>

<div
    id="logoPlaceholder"
    class="logo-placeholder"
>
    Team Logo
</div>

</div>

</label>


<input
    type="file"
    id="logoInput"
    accept="image/*"
    hidden
>


<div class="logo-label">
    Add Team Logo
</div>

</div>


<div class="field">

<label for="teamName">
    Team Name
</label>

<input
    id="teamName"
    type="text"
    placeholder="Enter team name"
    autocomplete="off"
>

</div>


<div class="field">

<label for="city">
    City
</label>

<input
    id="city"
    type="text"
    placeholder="Enter city"
    autocomplete="address-level2"
>

</div>


<div class="field">

<label for="captainMobile">
    Captain Mobile Number
</label>

<div class="mobile-wrap">

<input
    class="country-code"
    type="text"
    value="+91"
    readonly
>

<input
    class="mobile-input"
    id="captainMobile"
    type="tel"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter mobile number"
>

</div>

</div>


<div class="field">

<label for="captainName">
    Captain Name
</label>

<input
    id="captainName"
    type="text"
    placeholder="Enter captain name"
    autocomplete="name"
>

</div>


<button
    class="add-btn"
    id="addTeamButton"
    type="button"
    disabled
>
Add New Team ＋
</button>


<div
    class="status"
    id="status"
></div>


</div>


<button
    class="done-btn"
    id="doneButton"
    type="button"
    disabled
>
DONE
</button>


<div
    class="access-denied"
    id="accessDenied"
>
    🔒 Access Denied
    <br><br>
    Only the Organizer of this tournament can add or manage teams from this page.
</div>


</section>

</main>


<script type="module">

import {
    db,
    auth
}
from "./firebase.js";


import {
    doc,
    getDoc,
    updateDoc,
    arrayUnion
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* =========================================
   VARIABLES
========================================= */

let eventId = "";

let existingTeams = [];

let pendingTeams = [];

let selectedLogo = "";

let totalTeams = 0;

let currentUser = null;

let organizerUid = "";

let organizerVerified = false;


/* =========================================
   GET EVENT ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


eventId =
    params.get("eventId") ||
    sessionStorage.getItem(
        "crickpulseEventId"
    );


/* =========================================
   ELEMENTS
========================================= */

const eventIdDisplay =
    document.getElementById(
        "eventIdDisplay"
    );

const teamLimitDisplay =
    document.getElementById(
        "teamLimitDisplay"
    );

const savedTeams =
    document.getElementById(
        "savedTeams"
    );

const formCard =
    document.getElementById(
        "formCard"
    );

const addTeamButton =
    document.getElementById(
        "addTeamButton"
    );

const doneButton =
    document.getElementById(
        "doneButton"
    );

const status =
    document.getElementById(
        "status"
    );

const securityBox =
    document.getElementById(
        "securityBox"
    );

const accessDenied =
    document.getElementById(
        "accessDenied"
    );


/* =========================================
   EVENT ID CHECK
========================================= */

if(!eventId){

    alert(
        "Tournament ID is missing. Please create the tournament again."
    );

    window.location.href =
        "create-event.html";

}


/* =========================================
   KEEP EVENT ID
========================================= */

if(eventId){

    sessionStorage.setItem(
        "crickpulseEventId",
        eventId
    );

}


/* =========================================
   DISPLAY EVENT ID
========================================= */

eventIdDisplay.textContent =
    eventId;


/* =========================================
   TEAM COUNT
========================================= */

totalTeams =
    Number(
        sessionStorage.getItem(
            "crickpulseTeamCount"
        )
    );


if(
    !totalTeams ||
    totalTeams < 2
){

    alert(
        "Number of Teams is missing. Please complete Tournament Setup again."
    );

    window.location.href =
        "number-of-teams.html";

}


/* =========================================
   FIRESTORE EVENT
========================================= */

const eventRef =
    doc(
        db,
        "events",
        eventId
    );


/* =========================================
   SECURITY BLOCK
========================================= */

function denyAccess(message){

    organizerVerified =
        false;

    formCard.style.display =
        "none";

    addTeamButton.disabled =
        true;

    doneButton.disabled =
        true;

    accessDenied.style.display =
        "block";

    securityBox.textContent =
        "🔒 " + message;

    securityBox.style.color =
        "#c62828";

    securityBox.style.background =
        "#fff1f1";

    securityBox.style.borderColor =
        "#ff3b30";

}


/* =========================================
   VERIFY ORGANIZER
========================================= */

async function verifyOrganizer(){

    try{

        if(!currentUser){

            denyAccess(
                "Please login first."
            );

            return false;

        }


        if(!eventId){

            denyAccess(
                "Tournament ID is missing."
            );

            return false;

        }


        const snapshot =
            await getDoc(
                eventRef
            );


        if(
            !snapshot.exists()
        ){

            denyAccess(
                "Tournament not found."
            );

            return false;

        }


        const data =
            snapshot.data();


        /*
         * IMPORTANT:
         *
         * Organizer authority comes
         * ONLY from Firestore.
         *
         * We do NOT trust:
         *
         * sessionStorage
         * URL
         * HTML
         * local variables
         */


        organizerUid =
            String(
                data.organizerUid ||
                ""
            );


        if(!organizerUid){

            denyAccess(
                "This tournament has no Organizer UID."
            );

            return false;

        }


        if(
            organizerUid !==
            currentUser.uid
        ){

            denyAccess(
                "You are not the Organizer of this tournament."
            );

            return false;

        }


        /*
         * ORGANIZER VERIFIED
         */

        organizerVerified =
            true;


        securityBox.textContent =
            "🔐 Organizer verified. You can manage teams.";

        securityBox.style.color =
            "#237a43";

        securityBox.style.background =
            "#effaf3";

        securityBox.style.borderColor =
            "#35a85b";


        addTeamButton.disabled =
            false;

        doneButton.disabled =
            false;


        return true;

    }
    catch(error){

        console.error(
            "ORGANIZER VERIFICATION ERROR:",
            error
        );


        denyAccess(
            "Organizer verification failed."
        );

        return false;

    }

}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async function(user){

        currentUser =
            user || null;


        if(!currentUser){

            denyAccess(
                "Please login before managing teams."
            );

            return;

        }


        console.log(
            "CURRENT USER UID:",
            currentUser.uid
        );


        await initializePage();

    }
);


/* =========================================
   INITIALIZE PAGE
========================================= */

async function initializePage(){

    const verified =
        await verifyOrganizer();


    if(!verified){

        return;

    }


    await loadEvent();

}


/* =========================================
   UPDATE TEAM COUNT
========================================= */

function updateTeamCount(){

    const currentCount =
        existingTeams.length +
        pendingTeams.length;


    teamLimitDisplay.textContent =
        currentCount +
        " / " +
        totalTeams +
        " teams added";


    if(!organizerVerified){

        formCard.style.display =
            "none";

        return;

    }


    if(
        currentCount >=
        totalTeams
    ){

        formCard.style.display =
            "none";

    }
    else{

        formCard.style.display =
            "block";

    }

}


/* =========================================
   LOAD EVENT
========================================= */

async function loadEvent(){

    try{

        const snapshot =
            await getDoc(
                eventRef
            );


        if(
            !snapshot.exists()
        ){

            denyAccess(
                "Tournament document not found."
            );

            return;

        }


        const data =
            snapshot.data();


        /*
         * SECURITY RECHECK
         *
         * Even after initial verification,
         * check organizerUid again.
         */

        if(
            String(
                data.organizerUid ||
                ""
            )
            !==
            currentUser.uid
        ){

            denyAccess(
                "Organizer verification failed."
            );

            return;

        }


        existingTeams =
            Array.isArray(
                data.teams
            )
            ?
            data.teams
            :
            [];


        renderTeams();

        updateTeamCount();

    }
    catch(error){

        console.error(
            "LOAD EVENT ERROR:",
            error
        );

        denyAccess(
            "Tournament data could not be loaded."
        );

    }

}


/* =========================================
   LOGO PREVIEW
========================================= */

document
.getElementById("logoInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                selectedLogo =
                    e.target.result;


                const image =
                    document.getElementById(
                        "logoPreview"
                    );


                image.src =
                    selectedLogo;


                image.style.display =
                    "block";


                document
                .getElementById(
                    "logoPlaceholder"
                )
                .style.display =
                    "none";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   MOBILE INPUT
========================================= */

document
.getElementById("captainMobile")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /\D/g,
                ""
            );

    }
);


/* =========================================
   ADD TEAM - LOCAL
========================================= */

addTeamButton.addEventListener(
    "click",
    function(){

        /*
         * FRONT-END CHECK
         *
         * Real protection is still
         * Firestore Security Rules.
         */

        if(!organizerVerified){

            alert(
                "Access denied. Only Organizer can add teams."
            );

            return;

        }


        const currentCount =
            existingTeams.length +
            pendingTeams.length;


        if(
            currentCount >=
            totalTeams
        ){

            alert(
                "All " +
                totalTeams +
                " teams have already been added."
            );

            updateTeamCount();

            return;

        }


        const teamName =
            document
            .getElementById(
                "teamName"
            )
            .value
            .trim();


        const city =
            document
            .getElementById(
                "city"
            )
            .value
            .trim();


        const captainMobile =
            document
            .getElementById(
                "captainMobile"
            )
            .value
            .trim();


        const captainName =
            document
            .getElementById(
                "captainName"
            )
            .value
            .trim();


        if(!teamName){

            alert(
                "Please enter Team Name."
            );

            return;

        }


        if(!city){

            alert(
                "Please enter City."
            );

            return;

        }


        if(
            captainMobile.length !== 10
        ){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        if(!captainName){

            alert(
                "Please enter Captain Name."
            );

            return;

        }


        const duplicate =
            [
                ...existingTeams,
                ...pendingTeams
            ]
            .some(
                function(team){

                    return String(
                        team.teamName || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    teamName
                    .toLowerCase();

                }
            );


        if(duplicate){

            alert(
                "This team is already added."
            );

            return;

        }


        /*
         * TEAM OBJECT
         *
         * captainUid is intentionally
         * NOT assigned here.
         *
         * The actual Captain UID will
         * be attached when the invited
         * Captain joins through the
         * secure invitation flow.
         */

        const newTeam = {

            teamId:
                "TEAM_" +
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(
                    2,
                    8
                ),

            teamName:
                teamName,

            city:
                city,

            captainMobile:
                "+91" +
                captainMobile,

            captainName:
                captainName,

            captainUid:
                "",

            logo:
                selectedLogo || "",

            createdAt:
                new Date().toISOString(),

            createdBy:
                currentUser.uid

        };


        pendingTeams.push(
            newTeam
        );


        renderTeams();

        updateTeamCount();

        clearForm();


        status.textContent =
            "Team added. Press DONE to save.";


        const newCount =
            existingTeams.length +
            pendingTeams.length;


        if(
            newCount >=
            totalTeams
        ){

            status.textContent =
                "All teams added. Press DONE to save.";

        }

    }
);


/* =========================================
   RENDER TEAMS
========================================= */

function renderTeams(){

    savedTeams.innerHTML =
        "";


    const allTeams =
        [
            ...existingTeams,
            ...pendingTeams
        ];


    if(
        allTeams.length === 0
    ){

        savedTeams.innerHTML =
            `
            <div class="empty">
                No teams added yet.
            </div>
            `;

        return;

    }


    allTeams.forEach(
        function(team){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "saved-team";


            const logo =
                document.createElement(
                    "div"
                );


            logo.className =
                "saved-logo";


            if(team.logo){

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    team.logo;

                img.alt =
                    "Team Logo";


                logo.appendChild(
                    img
                );

            }
            else{

                logo.textContent =
                    "TEAM";

            }


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "saved-info";


            const name =
                document.createElement(
                    "h3"
                );


            name.textContent =
                team.teamName ||
                "";


            const city =
                document.createElement(
                    "p"
                );


            city.textContent =
                "City: " +
                (
                    team.city ||
                    ""
                );


            const captain =
                document.createElement(
                    "p"
                );


            captain.textContent =
                "Captain: " +
                (
                    team.captainName ||
                    ""
                );


            info.appendChild(
                name
            );

            info.appendChild(
                city
            );

            info.appendChild(
                captain
            );


            card.appendChild(
                logo
            );

            card.appendChild(
                info
            );


            savedTeams.appendChild(
                card
            );

        }
    );

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

    document
    .getElementById(
        "teamName"
    )
    .value =
        "";


    document
    .getElementById(
        "city"
    )

/* =========================================
   DONE - SAVE FIREBASE
========================================= */

doneButton.addEventListener(
    "click",
    async function(){

        /*
         * HARD UI CHECK
         */

        if(!organizerVerified){

            alert(
                "Access denied. Only Organizer can save teams."
            );

            return;

        }


        if(!currentUser){

            alert(
                "Please login first."
            );

            return;

        }


        /*
         * RECHECK FIRESTORE ORGANIZER
         * BEFORE WRITING.
         */

        try{

            const securitySnapshot =
                await getDoc(
                    eventRef
                );


            if(
                !securitySnapshot.exists()
            ){

                throw new Error(
                    "Tournament document does not exist."
                );

            }


            const securityData =
                securitySnapshot.data();


            if(
                String(
                    securityData.organizerUid ||
                    ""
                )
                !==
                currentUser.uid
            ){

                denyAccess(
                    "Organizer permission was not verified."
                );

                return;

            }


        }
        catch(error){

            console.error(
                "SECURITY RECHECK ERROR:",
                error
            );

            alert(
                "Security verification failed."
            );

            return;

        }


        if(
            pendingTeams.length === 0
        ){

            if(
                existingTeams.length >=
                totalTeams
            ){

                goBackToAddManually();

                return;

            }


            alert(
                "Please add at least one new team."
            );

            return;

        }


        const finalCount =
            existingTeams.length +
            pendingTeams.length;


        if(
            finalCount >
            totalTeams
        ){

            alert(
                "You cannot add more than " +
                totalTeams +
                " teams."
            );

            return;

        }


        doneButton.disabled =
            true;

        addTeamButton.disabled =
            true;

        doneButton.textContent =
            "Saving...";


        try{

            const latestSnapshot =
                await getDoc(
                    eventRef
                );


            if(
                !latestSnapshot.exists()
            ){

                throw new Error(
                    "Tournament document does not exist."
                );

            }


            const latestData =
                latestSnapshot.data();


            /*
             * FINAL ORGANIZER CHECK
             */

            if(
                String(
                    latestData.organizerUid ||
                    ""
                )
                !==
                currentUser.uid
            ){

                throw new Error(
                    "Permission denied. You are not the Organizer."
                );

            }


            const latestTeams =
                Array.isArray(
                    latestData.teams
                )
                ?
                latestData.teams
                :
                [];


            /*
             * DUPLICATE CHECK
             */

            for(
                const pendingTeam
                of pendingTeams
            ){

                const duplicate =
                    latestTeams.some(
                        function(team){

                            return String(
                                team.teamName ||
                                ""
                            )
                            .trim()
                            .toLowerCase()
                            ===
                            String(
                                pendingTeam.teamName
                            )
                            .trim()
                            .toLowerCase();

                        }
                    );


                if(duplicate){

                    throw new Error(
                        "Team already exists: " +
                        pendingTeam.teamName
                    );

                }

            }


            /*
             * FINAL COUNT
             */

            if(
                latestTeams.length +
                pendingTeams.length
                >
                totalTeams
            ){

                throw new Error(
                    "Team limit reached. Only " +
                    totalTeams +
                    " teams are allowed."
                );

            }


            /*
             * FIRESTORE WRITE
             *
             * Security Rules must also
             * approve this request.
             */

            await updateDoc(
                eventRef,
                {

                    teams:
                        arrayUnion(
                            ...pendingTeams
                        )

                }
            );


            existingTeams =
                [
                    ...latestTeams,
                    ...pendingTeams
                ];


            const savedCount =
                pendingTeams.length;


            pendingTeams =
                [];


            renderTeams();

            updateTeamCount();


            status.textContent =
                "";


            alert(
                savedCount +
                " team(s) saved successfully in Firebase."
            );


            if(
                existingTeams.length >=
                totalTeams
            ){

                goBackToAddManually();

            }

        }
        catch(error){

            console.error(
                "FIREBASE TEAM SAVE ERROR:",
                error
            );


            if(
                error.code ===
                "permission-denied"
            ){

                alert(
                    "🔒 Permission Denied.\n\nOnly the Organizer can modify teams in this tournament."
                );

            }
            else{

                alert(
                    "Team save नहीं हो पाई.\n\n" +
                    error.message
                );

            }

        }
        finally{

            doneButton.disabled =
                false;

            addTeamButton.disabled =
                false;

            doneButton.textContent =
                "DONE";

        }

    }
);
