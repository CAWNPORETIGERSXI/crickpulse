<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRICKPULSE | Add New Teams</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Verdana,Geneva,sans-serif;
    background:#f7f5ff;
    color:#171225;
    min-height:100vh;
}

.header{
    height:76px;
    background:#fff;
    border-bottom:1px solid #e4ddf2;

    display:flex;
    align-items:center;

    padding:0 15px;
}

.back-btn{
    width:52px;
    height:52px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    background:#fff;
    color:#6328c7;

    font-size:36px;
    font-weight:900;

    cursor:pointer;
}

.header-title{
    flex:1;

    text-align:center;

    font-size:25px;
    font-weight:900;

    margin-right:52px;
}

.container{
    width:100%;
    max-width:700px;

    margin:auto;

    padding:28px 16px 50px;
}

.main-card{
    background:#fff;

    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:26px 20px;

    box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.title{
    font-size:32px;
    font-weight:900;

    margin-bottom:10px;
}

.subtitle{
    font-size:19px;
    color:#6d667c;

    line-height:1.5;

    margin-bottom:22px;
}

.event-box{
    border:1.5px solid #ff3b30;
    border-radius:8px;

    padding:13px;

    margin-bottom:22px;
}

.event-label{
    font-size:15px;
    color:#6d667c;
    margin-bottom:5px;
}

.event-id{
    font-size:14px;
    font-weight:800;
    word-break:break-all;
}

.saved-team{
    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:14px;

    margin-bottom:14px;

    display:flex;
    align-items:center;

    gap:12px;

    background:#fff;
}

.saved-logo{
    width:60px;
    height:60px;

    min-width:60px;

    border-radius:50%;

    border:1.5px solid #ff3b30;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f7f5ff;

    color:#6c35d9;

    font-size:12px;
    font-weight:900;
}

.saved-info{
    flex:1;
    min-width:0;
}

.saved-info h3{
    font-size:20px;
    font-weight:900;

    margin-bottom:5px;

    word-break:break-word;
}

.saved-info p{
    font-size:15px;
    color:#6d667c;

    margin-top:3px;
}

.form-card{
    border:1.5px solid #ff3b30;
    border-radius:10px;

    padding:20px 16px;

    margin-top:22px;
}

.logo-section{
    text-align:center;
    margin-bottom:22px;
}

.logo-circle{
    width:120px;
    height:120px;

    margin:0 auto 10px;

    border:2px solid #ff3b30;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#fafafa;

    cursor:pointer;
}

.logo-circle img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.logo-placeholder{
    font-size:16px;
    color:#777;
}

.logo-label{
    color:#6c35d9;

    font-size:16px;
    font-weight:900;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;

    font-size:19px;
    font-weight:900;

    margin-bottom:8px;
}

.field input{
    width:100%;
    height:58px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    padding:0 14px;

    background:#fff;

    font-family:Verdana,Geneva,sans-serif;

    font-size:19px;

    outline:none;
}

.mobile-wrap{
    display:flex;
    gap:8px;
}

.country-code{
    width:70px !important;

    text-align:center;

    background:#f5f5f5 !important;

    font-weight:900;
}

.mobile-input{
    flex:1;
}

.add-btn,
.done-btn{
    width:100%;
    height:60px;

    border:1.5px solid #ff3b30;
    border-radius:8px;

    font-family:Verdana,Geneva,sans-serif;

    font-size:20px;
    font-weight:900;

    cursor:pointer;
}

.add-btn{
    background:#fff;
    color:#6c35d9;

    margin-top:5px;
}

.done-btn{
    background:#6c35d9;
    color:#fff;

    margin-top:22px;
}

.done-btn:disabled{
    opacity:.6;
}

.empty{
    text-align:center;

    color:#777;

    font-size:16px;

    padding:15px;
}

.status{
    margin-top:10px;

    text-align:center;

    font-size:16px;

    font-weight:800;
}

@media(max-width:480px){

    .header{
        height:74px;
        padding:0 11px;
    }

    .back-btn{
        width:50px;
        height:50px;
        font-size:34px;
    }

    .header-title{
        font-size:22px;
        margin-right:50px;
    }

    .container{
        padding:24px 14px 45px;
    }

    .main-card{
        padding:24px 16px;
    }

    .title{
        font-size:29px;
    }

    .subtitle{
        font-size:18px;
    }

    .field input{
        font-size:18px;
    }

}

</style>

</head>


<body>


<header class="header">

<button
    class="back-btn"
    id="backButton"
    type="button"
>
‹
</button>

<div class="header-title">
    Add New Teams
</div>

</header>


<main class="container">

<section class="main-card">

<div class="title">
    Add New Teams
</div>

<div class="subtitle">
    Add teams participating in this tournament.
</div>


<div class="event-box">

<div class="event-label">
    Tournament ID
</div>

<div
    class="event-id"
    id="eventIdDisplay"
>
    Loading...
</div>

</div>


<!-- SAVED TEAMS -->

<div id="savedTeams">

<div class="empty">
    No teams added yet.
</div>

</div>


<!-- FORM -->

<div class="form-card">


<!-- LOGO -->

<div class="logo-section">

<label for="logoInput">

<div class="logo-circle">

<img
    id="logoPreview"
    alt="Team Logo"
>

<div
    id="logoPlaceholder"
    class="logo-placeholder"
>
    Team Logo
</div>

</div>

</label>

<input
    type="file"
    id="logoInput"
    accept="image/*"
    hidden
>

<div class="logo-label">
    Add Team Logo
</div>

</div>


<!-- TEAM NAME -->

<div class="field">

<label for="teamName">
    Team Name
</label>

<input
    id="teamName"
    type="text"
    placeholder="Enter team name"
    autocomplete="off"
>

</div>


<!-- CITY -->

<div class="field">

<label for="city">
    City
</label>

<input
    id="city"
    type="text"
    placeholder="Enter city"
    autocomplete="address-level2"
>

</div>


<!-- CAPTAIN MOBILE -->

<div class="field">

<label for="captainMobile">
    Captain Mobile Number
</label>

<div class="mobile-wrap">

<input
    class="country-code"
    type="text"
    value="+91"
    readonly
>

<input
    class="mobile-input"
    id="captainMobile"
    type="tel"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter mobile number"
>

</div>

</div>


<!-- CAPTAIN NAME -->

<div class="field">

<label for="captainName">
    Captain Name
</label>

<input
    id="captainName"
    type="text"
    placeholder="Enter captain name"
    autocomplete="name"
>

</div>


<button
    class="add-btn"
    id="addTeamButton"
    type="button"
>
Add New Team ＋
</button>


<div
    class="status"
    id="status"
></div>

</div>


<button
    class="done-btn"
    id="doneButton"
    type="button"
>
DONE
</button>


</section>

</main>


<script type="module">

import { db } from "./firebase.js";

import {
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================
   VARIABLES
========================================= */

let eventId = "";

let existingTeams = [];

let pendingTeams = [];

let selectedLogo = "";


/* =========================================
   GET EVENT ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

eventId =
    params.get("eventId") ||
    sessionStorage.getItem(
        "crickpulseEventId"
    );


if(!eventId){

    alert(
        "Tournament ID is missing."
    );

    window.location.href =
        "create-event.html";

}


/* =========================================
   SHOW EVENT ID
========================================= */

document
.getElementById("eventIdDisplay")
.textContent =
    eventId;


/* =========================================
   FIRESTORE DOCUMENT
========================================= */

const eventRef =
    doc(
        db,
        "events",
        eventId
    );


/* =========================================
   LOAD EVENT
========================================= */

async function loadEvent(){

    try{

        const snapshot =
            await getDoc(
                eventRef
            );


        if(!snapshot.exists()){

            alert(
                "Tournament document not found in Firebase."
            );

            return;

        }


        const data =
            snapshot.data();


        if(
            Array.isArray(data.teams)
        ){

            existingTeams =
                data.teams;

        }
        else{

            existingTeams =
                [];

        }


        renderTeams();

    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        alert(
            "Tournament data load नहीं हो पाया."
        );

    }

}


/* =========================================
   LOGO PREVIEW
========================================= */

document
.getElementById("logoInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                selectedLogo =
                    e.target.result;


                const image =
                    document
                    .getElementById(
                        "logoPreview"
                    );


                image.src =
                    selectedLogo;


                image.style.display =
                    "block";


                document
                .getElementById(
                    "logoPlaceholder"
                )
                .style.display =
                    "none";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   MOBILE ONLY NUMBERS
========================================= */

document
.getElementById("captainMobile")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /\D/g,
                ""
            );

    }
);


/* =========================================
   ADD TEAM TO LIST
========================================= */

document
.getElementById("addTeamButton")
.addEventListener(
    "click",
    function(){

        const teamName =
            document
            .getElementById("teamName")
            .value
            .trim();


        const city =
            document
            .getElementById("city")
            .value
            .trim();


        const captainMobile =
            document
            .getElementById("captainMobile")
            .value
            .trim();


        const captainName =
            document
            .getElementById("captainName")
            .value
            .trim();


        if(!teamName){

            alert(
                "Please enter Team Name."
            );

            return;

        }


        if(!city){

            alert(
                "Please enter City."
            );

            return;

        }


        if(
            captainMobile.length !== 10
        ){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        if(!captainName){

            alert(
                "Please enter Captain Name."
            );

            return;

        }


        const duplicate =
            [
                ...existingTeams,
                ...pendingTeams
            ]
            .some(
                function(team){

                    return String(
                        team.teamName || ""
                    )
                    .toLowerCase()
                    ===
                    teamName.toLowerCase();

                }
            );


        if(duplicate){

            alert(
                "This team is already added."
            );

            return;

        }


        /*
        =====================================
        IMPORTANT

        Firestore में केवल simple values
        भेज रहे हैं।

        Logo अभी Firebase में नहीं भेजा जा रहा।
        =====================================
        */

        const newTeam = {

            teamId:
                "TEAM_" +
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2,8),

            teamName:
                teamName,

            city:
                city,

            captainMobile:
                "+91" +
                captainMobile,

            captainName:
                captainName,

            createdAt:
                new Date().toISOString()

        };


        pendingTeams.push(
            newTeam
        );


        renderTeams();

        clearForm();


        document
        .getElementById("status")
        .textContent =
            "Team added. Press DONE to save.";

    }
);


/* =========================================
   RENDER TEAMS
========================================= */

function renderTeams(){

    const container =
        document
        .getElementById(
            "savedTeams"
        );


    container.innerHTML =
        "";


    const allTeams =
        [
            ...existingTeams,
            ...pendingTeams
        ];


    if(allTeams.length === 0){

        container.innerHTML =
            `
            <div class="empty">
                No teams added yet.
            </div>
            `;

        return;

    }


    allTeams.forEach(
        function(team){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "saved-team";


            const logo =
                document.createElement(
                    "div"
                );

            logo.className =
                "saved-logo";

            logo.textContent =
                "TEAM";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "saved-info";


            const name =
                document.createElement(
                    "h3"
                );

            name.textContent =
                team.teamName || "";


            const city =
                document.createElement(
                    "p"
                );

            city.textContent =
                "City: " +
                (team.city || "");


            const captain =
                document.createElement(
                    "p"
                );

            captain.textContent =
                "Captain: " +
                (team.captainName || "");


            info.appendChild(
                name
            );

            info.appendChild(
                city
            );

            info.appendChild(
                captain
            );


            card.appendChild(
                logo
            );

            card.appendChild(
                info
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

    document
    .getElementById("teamName")
    .value =
        "";

    document
    .getElementById("city")
    .value =
        "";

    document
    .getElementById("captainMobile")
    .value =
        "";

    document
    .getElementById("captainName")
    .value =
        "";

    document
    .getElementById("logoInput")
    .value =
        "";


    selectedLogo =
        "";


    document
    .getElementById("logoPreview")
    .src =
        "";

    document
    .getElementById("logoPreview")
    .style.display =
        "none";


    document
    .getElementById("logoPlaceholder")
    .style.display =
        "block";

}


/* =========================================
   SAVE TO FIREBASE
========================================= */

document
.getElementById("doneButton")
.addEventListener(
    "click",
    async function(){

        if(
            pendingTeams.length === 0
        ){

            alert(
                "Please add at least one new team."
            );

            return;

        }


        const button =
            document
            .getElementById(
                "doneButton"
            );


        button.disabled =
            true;

        button.textContent =
            "Saving...";


        try{

            /*
            =================================
            READ LATEST FIREBASE DATA
            =================================
            */

            const latestSnapshot =
                await getDoc(
                    eventRef
                );


            if(
                !latestSnapshot.exists()
            ){

                throw new Error(
                    "Tournament document does not exist."
                );

            }


            const latestData =
                latestSnapshot.data();


            const latestTeams =
                Array.isArray(
                    latestData.teams
                )
                ? latestData.teams
                : [];


            /*
            =================================
            COMBINE TEAMS
            =================================
            */

            const combinedTeams =
                [
                    ...latestTeams,
                    ...pendingTeams
                ];


            /*
            =================================
            SAVE

            setDoc merge:true से existing
            tournament fields सुरक्षित रहेंगी।
            =================================
            */

            await setDoc(
                eventRef,
                {
                    teams:
                        combinedTeams
                },
                {
                    merge:true
                }
            );


            /*
            =================================
            SUCCESS
            =================================
            */

            existingTeams =
                combinedTeams;

            const count =
                pendingTeams.length;

            pendingTeams =
                [];


            renderTeams();


            document
            .getElementById("status")
            .textContent =
                "";


            alert(
                count +
                " team(s) saved successfully in Firebase."
            );

        }
        catch(error){

            console.error(
                "FIREBASE TEAM SAVE ERROR:",
                error
            );


            alert(
                "Team save नहीं हो पाई.\n\n" +
                error.message
            );

        }
        finally{

            button.disabled =
                false;

            button.textContent =
                "DONE";

        }

    }
);


/* =========================================
   BACK
========================================= */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


/* =========================================
   START
========================================= */

loadEvent();

</script>

</body>

</html>
